name: Catch-up Extract Legal + Licensing

on:
  push:
    branches: [feat/library-legal]
    paths:
      - "tooling/catchup-extract-legal-licensing.sh"
      - ".github/workflows/catchup-extract-legal-licensing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/library-legal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract certified staging modules and refresh lockfile
        run: bash tooling/catchup-extract-legal-licensing.sh
      - name: Commit deterministic extraction output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add @bke/legal @bke/licensing package-lock.json
          if git diff --cached --quiet; then
            echo "No extraction changes to commit."
            exit 0
          fi
          git commit -m "feat(library): extract Legal and Licensing"
          git push origin HEAD:feat/library-legal
