name: BKE Library - Licensing Package

# Deliberately certificate-only: publishing a release requires a separate authorized intent.
# PR and main pushes must never start package builds or publish licensing artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source and unique unpublished Licensing version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version="$(node -p "require('./@bke/licensing/package.json').version")"
          locked="$(node -p "require('./package-lock.json').packages['@bke/licensing'].version")"
          if [[ "$version" != "$locked" ]]; then
            echo "::error::@bke/licensing package and lockfile versions disagree"
            exit 1
          fi
          # Fail closed if the new bits would reuse any already published tag.
          # An unreachable remote also fails this assignment under set -e.
          existing="$(git ls-remote --tags origin "refs/tags/licensing-v${version}")"
          if [[ -n "$existing" ]]; then
            echo "::error::Immutable licensing-v${version} tag already exists; bump version before packaging"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Pack Licensing package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          version="$(node -p "require('./@bke/licensing/package.json').version")"
          artifact="$(npm pack --workspace=@bke/licensing --pack-destination artifacts --silent | tail -n 1)"
          artifact="$(basename "$artifact")"
          test "$artifact" = "bke-licensing-${version}.tgz"
          test -s "artifacts/$artifact"
          sha256sum "artifacts/$artifact" | tee "artifacts/$artifact.sha256"
          export LICENSING_VERSION="$version"
          export LICENSING_ARTIFACT="$artifact"
          export SOURCE_SHA="$(git rev-parse HEAD)"
          export SOURCE_TREE_SHA="$(git rev-parse HEAD^{tree})"
          export TARBALL_SHA256="$(cut -d' ' -f1 "artifacts/$artifact.sha256")"
          # This is CI evidence only, NOT release authority or a signed attestation.
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const e = process.env;
          writeFileSync("artifacts/licensing-package-provenance.json", JSON.stringify({
            schemaVersion: 1,
            component: "@bke/licensing",
            version: e.LICENSING_VERSION,
            sourceSha: e.SOURCE_SHA,
            sourceTreeSha: e.SOURCE_TREE_SHA,
            tarballFilename: e.LICENSING_ARTIFACT,
            tarballSha256: e.TARBALL_SHA256,
            state: "CERTIFIED_UNPUBLISHED_CANDIDATE",
          }, null, 2) + "\n");
          NODE
          echo "LICENSING_VERSION=$version" >> "$GITHUB_ENV"
          echo "LICENSING_ARTIFACT=$artifact" >> "$GITHUB_ENV"
      - name: Certify package contents
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf "artifacts/$LICENSING_ARTIFACT" > artifacts/package-contents.txt
          # Prove the evidence identifies precisely these packed bits and checkout.
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const manifest = JSON.parse(fs.readFileSync("artifacts/licensing-package-provenance.json", "utf8"));
          const treeSha = execFileSync("git", ["rev-parse", "HEAD^{tree}"], { encoding: "utf8" }).trim();
          const blob = fs.readFileSync("artifacts/" + process.env.LICENSING_ARTIFACT);
          const actualSha = crypto.createHash("sha256").update(blob).digest("hex");
          if (manifest.state !== "CERTIFIED_UNPUBLISHED_CANDIDATE" ||
              manifest.component !== "@bke/licensing" ||
              manifest.sourceSha !== process.env.GITHUB_SHA ||
              manifest.sourceTreeSha !== treeSha ||
              manifest.version !== process.env.LICENSING_VERSION ||
              manifest.tarballFilename !== process.env.LICENSING_ARTIFACT ||
              manifest.tarballSha256 !== actualSha) {
            throw Error("LICENSING_PACKAGE_PROVENANCE_MISMATCH");
          }
          console.log("Certified exact-head unpublished licensing package SHA-256:", actualSha);
          NODE
          grep -Fx 'package/package.json' artifacts/package-contents.txt
          grep -Fx 'package/module.manifest.ts' artifacts/package-contents.txt
          grep -Fx 'package/contracts/license-key-reveal.contract.ts' artifacts/package-contents.txt
          grep -Fx 'package/contracts/license-lookup.contract.ts' artifacts/package-contents.txt
          grep -Fx 'package/contracts/transfer-policy.contract.ts' artifacts/package-contents.txt
          grep -Fx 'package/contracts/signing-key-registry.contract.ts' artifacts/package-contents.txt
          grep -Fx 'package/contracts/grace-period.contract.ts' artifacts/package-contents.txt
          grep -Fx 'package/contracts/entitlement-management.contract.ts' artifacts/package-contents.txt
          grep -Fx 'package/prisma/repositories/postgres-license-lookup-repository.ts' artifacts/package-contents.txt
          grep -Fx 'package/prisma/repositories/postgres-transfer-policy-repository.ts' artifacts/package-contents.txt
          grep -Fx 'package/prisma/repositories/postgres-signing-key-registry-repository.ts' artifacts/package-contents.txt
          grep -Fx 'package/contracts/commercial-lease.contract.ts' artifacts/package-contents.txt
          grep -Fx 'package/contracts/account-product-lease.contract.ts' artifacts/package-contents.txt
          grep -Fx 'package/providers/ed25519-account-product-lease.ts' artifacts/package-contents.txt
          grep -Fx 'package/docs/ACCOUNT-PRODUCT-LEASE-JWS.md' artifacts/package-contents.txt
          grep -Fx 'package/logic/license-key-reveal.ts' artifacts/package-contents.txt
          grep -Fx 'package/logic/commercial-lease.ts' artifacts/package-contents.txt
          grep -Fx 'package/logic/commercial-lease-ports.ts' artifacts/package-contents.txt
          grep -Fx 'package/logic/commercial-signing-registry.ts' artifacts/package-contents.txt
          grep -Fx 'package/logic/grace-period.ts' artifacts/package-contents.txt
          grep -Fx 'package/logic/grace-period-ports.ts' artifacts/package-contents.txt
          grep -Fx 'package/logic/entitlement-management.ts' artifacts/package-contents.txt
          grep -Fx 'package/logic/lease-lifecycle.ts' artifacts/package-contents.txt
          grep -Fx 'package/logic/product-identity.ts' artifacts/package-contents.txt
          grep -Fx 'package/logic/refresh-decision.ts' artifacts/package-contents.txt
          grep -Fx 'package/logic/accepted-version-policy.ts' artifacts/package-contents.txt
          grep -Fx 'package/providers/aes-gcm-license-key-decrypter.ts' artifacts/package-contents.txt
          grep -Fx 'package/providers/ed25519-commercial-lease-signer.ts' artifacts/package-contents.txt
          grep -Fx 'package/prisma/schema.prisma' artifacts/package-contents.txt
          grep -Fx 'package/prisma/repositories/postgres-license-key-reveal-repository.ts' artifacts/package-contents.txt
          grep -Fx 'package/prisma/repositories/postgres-commercial-lease-store.ts' artifacts/package-contents.txt
          grep -Fx 'package/prisma/repositories/postgres-commercial-signing-key-provider.ts' artifacts/package-contents.txt
          grep -Fx 'package/prisma/repositories/postgres-grace-period-store.ts' artifacts/package-contents.txt
          grep -Fx 'package/migrations/0001_licensing_baseline/migration.sql' artifacts/package-contents.txt
          grep -Fx 'package/migrations/0002_commercial_lease_runtime/migration.sql' artifacts/package-contents.txt
          grep -Fx 'package/migrations/0003_transfer_policy_facts/migration.sql' artifacts/package-contents.txt
          grep -Fx 'package/migrations/0004_grace_period_overrides/migration.sql' artifacts/package-contents.txt
          grep -Fx 'package/docs/EXTRACTION-SOURCE.md' artifacts/package-contents.txt
          if grep -E '^package/(tests|node_modules)/' artifacts/package-contents.txt; then
            echo '::error::Tests or dependency caches must not ship in @bke/licensing.'
            exit 1
          fi
      - name: Install tarball in blank consumer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .package-smoke
          mkdir -p .package-smoke
          cat > .package-smoke/package.json <<JSON
          {
            "private": true,
            "type": "module",
            "dependencies": { "@bke/licensing": "file:../artifacts/$LICENSING_ARTIFACT" },
            "devDependencies": {
              "@types/node": "^24.3.0",
              "@types/pg": "^8.15.5",
              "@types/semver": "7.8.0",
              "tsx": "^4.20.5",
              "typescript": "^5.9.2"
            }
          }
          JSON
          cat > .package-smoke/tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "types": ["node"]
            },
            "include": ["smoke.ts"]
          }
          JSON
          cat > .package-smoke/smoke.ts <<'TS'
          import {
            LICENSING_COMMERCIAL_LEASE_CAPABILITY_ID,
            commercialLeaseActions,
          } from "@bke/licensing/contracts/commercial-lease.contract";
          import { LICENSING_ENTITLEMENT_MANAGEMENT_CAPABILITY_ID } from "@bke/licensing/contracts/entitlement-management.contract";
          import { LICENSING_GRACE_PERIOD_CAPABILITY_ID } from "@bke/licensing/contracts/grace-period.contract";
          import type { LicensingLicenseLookup } from "@bke/licensing/contracts/license-lookup.contract";
          import { createPostgresLicensingLicenseLookupRepository } from "@bke/licensing/prisma/repositories/postgres-license-lookup-repository";
          import { LICENSING_TRANSFER_POLICY_CAPABILITY_ID, isTransferAllowed, type LicensingTransferPolicyCapability } from "@bke/licensing/contracts/transfer-policy.contract";
          import { createPostgresLicensingTransferPolicyCapability } from "@bke/licensing/prisma/repositories/postgres-transfer-policy-repository";
          import { LICENSING_SIGNING_KEY_REGISTRY_CAPABILITY_ID, type LicensingSigningKeyRegistryCapability } from "@bke/licensing/contracts/signing-key-registry.contract";
          import { createPostgresLicensingSigningKeyRegistryCapability } from "@bke/licensing/prisma/repositories/postgres-signing-key-registry-repository";
          import { LICENSING_LICENSE_KEY_REVEAL_CAPABILITY_ID } from "@bke/licensing/contracts/license-key-reveal.contract";
          import { createCommercialLeaseCapability } from "@bke/licensing/logic/commercial-lease";
          import { createLicensingEntitlementManagementCapability, licensingInitialExpiration, licensingRenewalExpiration } from "@bke/licensing/logic/entitlement-management";
          import { createLicensingGracePeriodCapability, parseLicensingGraceBoolean, parseLicensingGraceProduct } from "@bke/licensing/logic/grace-period";
          import { createLicensingLicenseKeyRevealCapability } from "@bke/licensing/logic/license-key-reveal";
          import { selectActiveCommercialSigningKey } from "@bke/licensing/logic/commercial-signing-registry";
          import { nextLeaseLifecycle, requireProductVersion } from "@bke/licensing/logic/lease-lifecycle";
          import { deviceIdentity } from "@bke/licensing/logic/product-identity";
          import { isVersionAccepted, validateAcceptedVersionRange } from "@bke/licensing/logic/accepted-version-policy";
          import { refreshRequiresReplacement } from "@bke/licensing/logic/refresh-decision";
          import { createAesGcmLicensingLicenseKeyDecrypter } from "@bke/licensing/providers/aes-gcm-license-key-decrypter";
          import { createEd25519CommercialLeaseSigner } from "@bke/licensing/providers/ed25519-commercial-lease-signer";
          import { ACCOUNT_PRODUCT_LEASE_CAPABILITY_ID, ACCOUNT_PRODUCT_LEASE_SCHEMA } from "@bke/licensing/contracts/account-product-lease.contract";
          import { issueAccountProductLeaseJws, verifyAccountProductLeaseJws } from "@bke/licensing/providers/ed25519-account-product-lease";
          import { createPostgresCommercialLeaseStore } from "@bke/licensing/prisma/repositories/postgres-commercial-lease-store";
          import { createPostgresCommercialSigningKeyProvider } from "@bke/licensing/prisma/repositories/postgres-commercial-signing-key-provider";
          import { createPostgresLicensingGracePeriodStore } from "@bke/licensing/prisma/repositories/postgres-grace-period-store";
          import { createPostgresLicensingLicenseKeyRevealRepository } from "@bke/licensing/prisma/repositories/postgres-license-key-reveal-repository";
          import { licensingModuleManifest } from "@bke/licensing/module.manifest";

          if (LICENSING_LICENSE_KEY_REVEAL_CAPABILITY_ID !== "bke.licensing.license-key-reveal.v1") throw new Error("Unexpected reveal capability id.");
          if (LICENSING_COMMERCIAL_LEASE_CAPABILITY_ID !== "bke.licensing.commercial-lease.v1") throw new Error("Unexpected commercial lease capability id.");
          if (ACCOUNT_PRODUCT_LEASE_CAPABILITY_ID !== "bke.licensing.account-product-lease.v1" || ACCOUNT_PRODUCT_LEASE_SCHEMA !== "bke.product-lease.v1") throw new Error("Packed product lease contract missing.");
          if (LICENSING_TRANSFER_POLICY_CAPABILITY_ID !== "bke.licensing.transfer-policy.v1") throw new Error("Unexpected transfer policy capability id.");
          if (LICENSING_SIGNING_KEY_REGISTRY_CAPABILITY_ID !== "bke.licensing.signing-key-registry.v1") throw new Error("Unexpected signing-key registry capability id.");
          if (LICENSING_GRACE_PERIOD_CAPABILITY_ID !== "bke.licensing.grace-period.v1") throw new Error("Unexpected grace-period capability id.");
          if (LICENSING_ENTITLEMENT_MANAGEMENT_CAPABILITY_ID !== "bke.licensing.entitlement-management.v1") throw new Error("Unexpected entitlement-management capability id.");
          if (licensingModuleManifest.moduleId !== "bke.licensing") throw new Error("Unexpected Licensing module id.");
          if (!licensingModuleManifest.provides.includes(LICENSING_COMMERCIAL_LEASE_CAPABILITY_ID)) throw new Error("Commercial lease capability missing from manifest.");
          if (!licensingModuleManifest.provides.includes(LICENSING_TRANSFER_POLICY_CAPABILITY_ID)) throw new Error("Transfer policy capability missing from manifest.");
          if (!licensingModuleManifest.provides.includes(LICENSING_SIGNING_KEY_REGISTRY_CAPABILITY_ID)) throw new Error("Signing-key registry capability missing from manifest.");
          if (!licensingModuleManifest.provides.includes(LICENSING_GRACE_PERIOD_CAPABILITY_ID)) throw new Error("Grace-period capability missing from manifest.");
          if (!licensingModuleManifest.provides.includes(LICENSING_ENTITLEMENT_MANAGEMENT_CAPABILITY_ID)) throw new Error("Entitlement-management capability missing from manifest.");
          if (commercialLeaseActions.join(",") !== "ACTIVATION,REFRESH,RENEWAL,TRANSFER,REPLACEMENT,REVOCATION_REPLACEMENT,KEY_ROTATION") throw new Error("Commercial lease action surface drifted.");
          if (
            typeof createCommercialLeaseCapability !== "function" ||
            typeof createLicensingEntitlementManagementCapability !== "function" ||
            typeof licensingInitialExpiration !== "function" ||
            typeof licensingRenewalExpiration !== "function" ||
            typeof createLicensingGracePeriodCapability !== "function" ||
            typeof parseLicensingGraceBoolean !== "function" ||
            typeof parseLicensingGraceProduct !== "function" ||
            typeof createPostgresLicensingGracePeriodStore !== "function" ||
            typeof createLicensingLicenseKeyRevealCapability !== "function" ||
            typeof selectActiveCommercialSigningKey !== "function" ||
            typeof nextLeaseLifecycle !== "function" ||
            typeof requireProductVersion !== "function" ||
            typeof deviceIdentity !== "function" ||
            typeof refreshRequiresReplacement !== "function" ||
            typeof createAesGcmLicensingLicenseKeyDecrypter !== "function" ||
            typeof createEd25519CommercialLeaseSigner !== "function" ||
            typeof issueAccountProductLeaseJws !== "function" ||
            typeof verifyAccountProductLeaseJws !== "function" ||
            typeof createPostgresCommercialLeaseStore !== "function" ||
            typeof createPostgresCommercialSigningKeyProvider !== "function" ||
            typeof createPostgresLicensingLicenseKeyRevealRepository !== "function" ||
            typeof createPostgresLicensingTransferPolicyCapability !== "function" ||
            typeof createPostgresLicensingSigningKeyRegistryCapability !== "function" ||
            typeof isTransferAllowed !== "function"
          ) throw new Error("Packed Licensing consumer exports are incomplete.");
          const lookup: LicensingLicenseLookup = createPostgresLicensingLicenseLookupRepository("postgresql://unused:unused@localhost/unused");
          if (typeof lookup.findByKeyHash !== "function") throw new Error("Packed Licensing lookup contract missing.");
          const transferPolicy: LicensingTransferPolicyCapability = createPostgresLicensingTransferPolicyCapability("postgresql://unused:unused@localhost/unused");
          const signingKeyRegistry: LicensingSigningKeyRegistryCapability = createPostgresLicensingSigningKeyRegistryCapability("postgresql://unused:unused@localhost/unused");
          if (typeof signingKeyRegistry.ensure !== "function" || typeof signingKeyRegistry.active !== "function" || typeof signingKeyRegistry.listPublic !== "function") throw new Error("Packed signing-key registry missing.");
          if (typeof transferPolicy.findByPolicyId !== "function") throw new Error("Packed transfer policy lookup missing.");
          if (!isTransferAllowed({ requestedPolicyId: "policy-a", orderItemPolicyId: "policy-a", policy: { policyId: "policy-a", transferable: true } })) throw new Error("Packed transfer policy allow case failed.");
          if (isTransferAllowed({ requestedPolicyId: "policy-a", orderItemPolicyId: "policy-b", policy: { policyId: "policy-b", transferable: true } })) throw new Error("Packed transfer policy mismatch case failed.");
          if (!isVersionAccepted("1.2.3", "1.2.3", "2.0.0")) throw new Error("Packed version policy inclusion failed.");
          if (isVersionAccepted("2.0.1", null, "2.0.0")) throw new Error("Packed version policy exclusion failed.");
          if (validateAcceptedVersionRange("v1.2.3", null).minimum !== "1.2.3") throw new Error("Packed version policy normalization failed.");
          if (parseLicensingGraceProduct("airstack") !== "airstack" || parseLicensingGraceBoolean("true") !== true) throw new Error("Packed grace-period parser parity failed.");
          const expiration = licensingInitialExpiration(new Date("2026-09-12T00:00:00Z"), 30);
          if (expiration?.toISOString() !== "2026-10-12T00:00:00.000Z") throw new Error("Packed entitlement initial-expiration parity failed.");
          if (licensingRenewalExpiration(null, new Date("2026-09-12T00:00:00Z"), 1000).toISOString() !== "2026-09-12T00:00:01.000Z") throw new Error("Packed entitlement renewal-expiration parity failed.");
          const entitlement = createLicensingEntitlementManagementCapability({
            issue: async () => ({ id: "license-1", publicId: "public-1", subscriptionId: null, status: "ACTIVE", expiresAt: expiration }),
            renewSubscription: async () => ({ licenses: [], renewalOperations: [] }),
          });
          if (typeof entitlement.issue !== "function" || typeof entitlement.renewSubscription !== "function") throw new Error("Packed entitlement-management capability missing.");
          // Exercise the ACTUAL tarball-installed JWS provider, never workspace source.
          // Only disposable CI keys are generated; no private key is persisted.
          const { createHash, generateKeyPairSync } = await import("node:crypto");
          const signer = generateKeyPairSync("ed25519");
          const agent = generateKeyPairSync("ed25519");
          const kid = "test-packaged-product-lease-2026";
          const privateKeyPem = signer.privateKey.export({ type: "pkcs8", format: "pem" }).toString();
          const publicKeyPem = signer.publicKey.export({ type: "spki", format: "pem" }).toString();
          const agentKeyThumbprint = createHash("sha256")
            .update(agent.publicKey.export({ type: "spki", format: "der" }))
            .digest("base64url");
          const now = new Date("2026-11-12T10:00:00.000Z");
          const lease = Object.freeze({
            schema: ACCOUNT_PRODUCT_LEASE_SCHEMA,
            issuer: "BKE Digital Solutions", audience: "bke-product",
            leaseId: "packed-smoke-lease-01",
            accountId: "server-account", userId: "server-user",
            productId: "render-dock", agentSessionId: "agent-session",
            agentKeyThumbprint, keyProtection: "software", plan: "subscription",
            allowedActions: ["OPEN"],
            issuedAt: "2026-11-12T09:59:00.000Z",
            refreshAfter: "2026-11-12T10:01:00.000Z",
            expiresAt: "2026-11-12T10:05:00.000Z",
          } as const);
          const jws = issueAccountProductLeaseJws(lease, { kid, privateKeyPem });
          const expected = {
            issuer: lease.issuer, audience: lease.audience,
            accountId: lease.accountId, userId: lease.userId,
            productId: lease.productId, agentSessionId: lease.agentSessionId,
            agentKeyThumbprint, action: "OPEN" as const, now,
          };
          const keys = new Map([[kid, { publicKeyPem, state: "ACTIVE" as const }]]);
          const valid = verifyAccountProductLeaseJws(jws, keys, expected);
          if (!valid.ok || valid.kid !== kid || valid.claims.leaseId !== lease.leaseId)
            throw new Error("PACKED_JWS_ROUND_TRIP_FAILED");
          const verifiedOnly = verifyAccountProductLeaseJws(jws, new Map([
            [kid, { publicKeyPem, state: "VERIFY_ONLY" as const }],
          ]), expected);
          if (!verifiedOnly.ok) throw new Error("PACKED_JWS_ROTATION_VERIFY_ONLY_FAILED");
          function rejected(
            label: string, result: ReturnType<typeof verifyAccountProductLeaseJws>, reason: string,
          ) {
            if (result.ok || result.reason !== reason)
              throw new Error("PACKED_JWS_" + label + "_EXPECTED_" + reason);
          }
          rejected("UNKNOWN_KID", verifyAccountProductLeaseJws(jws, new Map(), expected), "UNTRUSTED_KID");
          rejected("REVOKED_KID", verifyAccountProductLeaseJws(jws, new Map([
            [kid, { publicKeyPem, state: "REVOKED" as const }],
          ]), expected), "UNTRUSTED_KID");
          rejected("WRONG_PRODUCT", verifyAccountProductLeaseJws(jws, keys, {
            ...expected, productId: "another-product",
          }), "CLAIM_MISMATCH");
          rejected("WRONG_ACCOUNT", verifyAccountProductLeaseJws(jws, keys, {
            ...expected, accountId: "another-account",
          }), "CLAIM_MISMATCH");
          rejected("WRONG_ACTION", verifyAccountProductLeaseJws(jws, keys, {
            ...expected, action: "USE",
          }), "CLAIM_MISMATCH");
          rejected("WRONG_AGENT", verifyAccountProductLeaseJws(jws, keys, {
            ...expected, agentSessionId: "another-session",
          }), "CLAIM_MISMATCH");
          rejected("WRONG_AGENT_KEY", verifyAccountProductLeaseJws(jws, keys, {
            ...expected, agentKeyThumbprint: "_".repeat(43),
          }), "CLAIM_MISMATCH");
          rejected("WRONG_ISSUER", verifyAccountProductLeaseJws(jws, keys, {
            ...expected, issuer: "untrusted-issuer",
          }), "CLAIM_MISMATCH");
          rejected("EXPIRED", verifyAccountProductLeaseJws(jws, keys, {
            ...expected, now: new Date(lease.expiresAt),
          }), "EXPIRED");
          rejected("FUTURE_ISSUED_AT", verifyAccountProductLeaseJws(jws, keys, {
            ...expected, now: new Date("2026-11-12T09:58:00.000Z"),
            allowedFutureSkewMs: 0,
          }), "FUTURE_ISSUED_AT");
          const parts = jws.split(".");
          const changedPayload = Buffer.from(JSON.stringify({
            ...lease, productId: "tampered-product",
          }), "utf8").toString("base64url");
          rejected("TAMPERED_COMPACT_BYTES", verifyAccountProductLeaseJws(
            [parts[0], changedPayload, parts[2]].join("."), keys, expected,
          ), "INVALID_SIGNATURE");
          const bogusHeader = Buffer.from(JSON.stringify({
            alg: "none", kid, typ: "bke.product-lease.v1+jws",
          }), "utf8").toString("base64url");
          rejected("ALG_CONFUSION", verifyAccountProductLeaseJws(
            [bogusHeader, parts[1], parts[2]].join("."), keys, expected,
          ), "MALFORMED_JWS");
          const alternate = generateKeyPairSync("ed25519");
          const forged = issueAccountProductLeaseJws(lease, {
            kid, privateKeyPem: alternate.privateKey.export({ type: "pkcs8", format: "pem" }).toString(),
          });
          rejected("FORGED_SIGNER", verifyAccountProductLeaseJws(
            forged, keys, expected,
          ), "INVALID_SIGNATURE");
          let badClaimsRefused = false;
          try {
            issueAccountProductLeaseJws({ ...lease, allowedActions: [] }, { kid, privateKeyPem });
          } catch (error) {
            badClaimsRefused = error instanceof Error && error.message === "ACCOUNT_PRODUCT_LEASE_CLAIMS_INVALID";
          }
          if (!badClaimsRefused) throw new Error("PACKED_JWS_INVALID_CLAIMS_NOT_REJECTED");
          console.log("PASS: packed JWS signer/verifier executable with real disposable Ed25519 and 13 negative/rotation cases");
          console.log("Packed @bke/licensing account-product JWS and legacy consumer smoke GREEN");
          TS
          npm install --prefix .package-smoke
          npx --prefix .package-smoke tsc -p .package-smoke/tsconfig.json --noEmit
          npx --prefix .package-smoke tsx .package-smoke/smoke.ts
      - name: Upload certified package evidence
        uses: actions/upload-artifact@v7
        with:
          name: bke-licensing-certified-package
          path: artifacts/
          if-no-files-found: error
