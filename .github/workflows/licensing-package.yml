name: BKE Library - Licensing Package

on:
  pull_request:
    branches: [main]
    paths:
      - "@bke/licensing/**"
      - "package-lock.json"
      - ".github/workflows/licensing-package.yml"
  push:
    branches: [main]
    paths:
      - "@bke/licensing/**"
      - "package-lock.json"
      - ".github/workflows/licensing-package.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Pack Licensing package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          artifact="$(npm pack --workspace=@bke/licensing --pack-destination artifacts --silent | tail -n 1)"
          artifact="$(basename "$artifact")"
          test "$artifact" = "bke-licensing-0.1.0.tgz"
          test -s "artifacts/$artifact"
          sha256sum "artifacts/$artifact" | tee "artifacts/$artifact.sha256"
          echo "LICENSING_ARTIFACT=$artifact" >> "$GITHUB_ENV"
      - name: Certify package contents
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf "artifacts/$LICENSING_ARTIFACT" > artifacts/package-contents.txt
          grep -Fx 'package/package.json' artifacts/package-contents.txt
          grep -Fx 'package/module.manifest.ts' artifacts/package-contents.txt
          grep -Fx 'package/contracts/license-key-reveal.contract.ts' artifacts/package-contents.txt
          grep -Fx 'package/contracts/license.contract.ts' artifacts/package-contents.txt
          grep -Fx 'package/contracts/module.contract.ts' artifacts/package-contents.txt
          grep -Fx 'package/logic/license-key-reveal.ts' artifacts/package-contents.txt
          grep -Fx 'package/providers/aes-gcm-license-key-decrypter.ts' artifacts/package-contents.txt
          grep -Fx 'package/prisma/schema.prisma' artifacts/package-contents.txt
          grep -Fx 'package/prisma/repositories/postgres-license-key-reveal-repository.ts' artifacts/package-contents.txt
          grep -Fx 'package/migrations/0001_licensing_baseline/migration.sql' artifacts/package-contents.txt
          grep -Fx 'package/docs/EXTRACTION-SOURCE.md' artifacts/package-contents.txt
          if grep -E '^package/(tests|node_modules)/' artifacts/package-contents.txt; then
            echo '::error::Tests or dependency caches must not ship in @bke/licensing.'
            exit 1
          fi
      - name: Install tarball in blank consumer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .package-smoke
          mkdir -p .package-smoke
          cat > .package-smoke/package.json <<JSON
          {
            "private": true,
            "type": "module",
            "dependencies": { "@bke/licensing": "file:../artifacts/$LICENSING_ARTIFACT" },
            "devDependencies": {
              "@types/node": "^24.3.0",
              "@types/pg": "^8.15.5",
              "tsx": "^4.20.5",
              "typescript": "^5.9.2"
            }
          }
          JSON
          cat > .package-smoke/tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "types": ["node"]
            },
            "include": ["smoke.ts"]
          }
          JSON
          cat > .package-smoke/smoke.ts <<'TS'
          import { LICENSING_LICENSE_KEY_REVEAL_CAPABILITY_ID } from "@bke/licensing/contracts/license-key-reveal.contract";
          import { createLicensingLicenseKeyRevealCapability } from "@bke/licensing/logic/license-key-reveal";
          import { createAesGcmLicensingLicenseKeyDecrypter } from "@bke/licensing/providers/aes-gcm-license-key-decrypter";
          import { createPostgresLicensingLicenseKeyRevealRepository } from "@bke/licensing/prisma/repositories/postgres-license-key-reveal-repository";
          import { licensingModuleManifest } from "@bke/licensing/module.manifest";
          if (LICENSING_LICENSE_KEY_REVEAL_CAPABILITY_ID !== "bke.licensing.license-key-reveal.v1") throw new Error("Unexpected Licensing capability id.");
          if (licensingModuleManifest.moduleId !== "bke.licensing") throw new Error("Unexpected Licensing module id.");
          if (
            typeof createLicensingLicenseKeyRevealCapability !== "function" ||
            typeof createAesGcmLicensingLicenseKeyDecrypter !== "function" ||
            typeof createPostgresLicensingLicenseKeyRevealRepository !== "function"
          ) throw new Error("Packed Licensing consumer exports are incomplete.");
          console.log("Packed @bke/licensing consumer smoke GREEN");
          TS
          npm install --prefix .package-smoke
          npx --prefix .package-smoke tsc -p .package-smoke/tsconfig.json --noEmit
          npx --prefix .package-smoke tsx .package-smoke/smoke.ts
      - name: Upload certified package evidence
        uses: actions/upload-artifact@v7
        with:
          name: bke-licensing-0.1.0
          path: |
            artifacts/bke-licensing-0.1.0.tgz
            artifacts/bke-licensing-0.1.0.tgz.sha256
            artifacts/package-contents.txt
          if-no-files-found: error
      - name: Create immutable Licensing release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./@bke/licensing/package.json').version")"
          tag="licensing-v${version}"
          package_changed=false
          if [[ "${{ github.event_name }}" == "push" ]] && [[ -n "${BEFORE_SHA:-}" ]] && ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- @bke/licensing/package.json; then package_changed=true; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$package_changed" == "true" ]]; then
              echo "::error::Release $tag already exists. Package versions are immutable; bump @bke/licensing version."
              exit 1
            fi
            echo "Release $tag already exists and package version is unchanged."
            exit 0
          fi
          gh release create "$tag" \
            "artifacts/$LICENSING_ARTIFACT" \
            "artifacts/$LICENSING_ARTIFACT.sha256" \
            --target "$GITHUB_SHA" \
            --title "@bke/licensing v${version}" \
            --notes "Certified BKE Licensing package artifact. Source, persistence, behavior, and package gates passed before release creation."
