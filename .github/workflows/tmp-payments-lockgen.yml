name: TEMP Payments 0.2.0 Lockfile Generation

on:
  push:
    branches:
      - feat/payments-error-taxonomy

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-error-taxonomy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate workspace lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(payments): regenerate 0.2.0 lockfile"
          git push origin HEAD:feat/payments-error-taxonomy
