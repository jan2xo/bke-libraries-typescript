name: Bootstrap Accounts Physical Extraction

on:
  push:
    branches: [feat/accounts-physical-extraction]
    paths:
      - ".github/workflows/bootstrap-accounts-extraction.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/accounts-physical-extraction
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Materialize certified Accounts package
        shell: bash
        env:
          SOURCE_SHA: 0e6afbf92bf08762e10892643e99b607332eac61
        run: |
          set -euo pipefail
          rm -rf /tmp/ds
          git clone --filter=blob:none --no-checkout https://github.com/jan2xo/bke-digital-solutions.git /tmp/ds
          git -C /tmp/ds fetch --depth=1 origin "$SOURCE_SHA"
          git -C /tmp/ds checkout --detach FETCH_HEAD

          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path

          source_sha = os.environ["SOURCE_SHA"]
          source = Path("/tmp/ds/v2/modules/accounts")
          target = Path("@bke/accounts")
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True)

          for name in ["contracts", "logic", "providers"]:
              shutil.copytree(source / name, target / name)

          (target / "prisma" / "repositories").mkdir(parents=True)
          shutil.copy2(source / "prisma" / "schema.prisma", target / "prisma" / "schema.prisma")
          for item in (source / "prisma" / "repositories").iterdir():
              if item.is_file():
                  shutil.copy2(item, target / "prisma" / "repositories" / item.name)

          shutil.copytree(source / "prisma" / "migrations", target / "migrations")
          shutil.copy2(source / "module.manifest.ts", target / "module.manifest.ts")
          prisma_config = (source / "prisma.config.ts").read_text().replace(
              'path: "prisma/migrations"', 'path: "migrations"'
          )
          (target / "prisma.config.ts").write_text(prisma_config)

          tests = target / "tests"
          tests.mkdir()
          for item in (source / "test").iterdir():
              if not item.is_file() or item.name == "module-composition.test.ts":
                  continue
              text = item.read_text()
              if item.name == "extraction.certify.ts":
                  text = text.replace('path.startsWith("test/")', 'path.startsWith("tests/")')
                  text = text.replace(
                      '"prisma/migrations/0001_accounts_baseline/migration.sql"',
                      '"migrations/0001_accounts_baseline/migration.sql"',
                  )
                  text = text.replace('"test",', '"tests",')
              (tests / item.name).write_text(text)

          docs = target / "docs"
          docs.mkdir()
          shutil.copy2(source / "docs" / "README.md", docs / "CAPABILITIES.md")
          shutil.copy2(source / "docs" / "EXTRACTION.md", docs / "EXTRACTION-SOURCE.md")

          package = {
              "name": "@bke/accounts",
              "version": "0.1.0",
              "description": "Reusable BKE Accounts capability library",
              "type": "module",
              "engines": {"node": ">=22.12.0"},
              "files": [
                  "contracts", "logic", "providers", "prisma", "migrations", "docs",
                  "module.manifest.ts", "prisma.config.ts", "README.md"
              ],
              "exports": {
                  "./contracts/*": "./contracts/*.ts",
                  "./logic/*": "./logic/*.ts",
                  "./providers/*": "./providers/*.ts",
                  "./prisma/repositories/*": "./prisma/repositories/*.ts",
                  "./module.manifest": "./module.manifest.ts",
                  "./prisma.config": "./prisma.config.ts",
                  "./package.json": "./package.json"
              },
              "scripts": {
                  "typecheck": "tsc -p tsconfig.json --noEmit",
                  "test": "vitest run tests/*.test.ts",
                  "prisma:validate": "prisma validate --config prisma.config.ts",
                  "prisma:deploy": "prisma migrate deploy --config prisma.config.ts"
              },
              "dependencies": {"pg": "^8.16.3"}
          }
          (target / "package.json").write_text(json.dumps(package, indent=2) + "\n")

          tsconfig = {
              "compilerOptions": {
                  "target": "ES2022",
                  "lib": ["ES2022"],
                  "strict": True,
                  "noEmit": True,
                  "skipLibCheck": True,
                  "esModuleInterop": True,
                  "module": "ESNext",
                  "moduleResolution": "Bundler",
                  "resolveJsonModule": True,
                  "isolatedModules": True,
                  "types": ["node", "vitest/globals"]
              },
              "include": [
                  "contracts/**/*.ts", "logic/**/*.ts", "providers/**/*.ts",
                  "prisma/**/*.ts", "tests/**/*.ts", "module.manifest.ts", "prisma.config.ts"
              ]
          }
          (target / "tsconfig.json").write_text(json.dumps(tsconfig, indent=2) + "\n")

          (target / "README.md").write_text(f'''# @bke/accounts\n\nReusable BKE Accounts capability library.\n\nThis package was physically extracted from certified Digital Solutions V2 Accounts staging at source commit `{source_sha}`. Business logic, contracts, providers, PostgreSQL repositories, Prisma schema, and baseline migration are package-owned. Digital Solutions host composition is intentionally excluded.\n\n## Install\n\nPin the exact certified package artifact/version used by the host. This package is not asserted to be publicly published to npm.\n\n## Use\n\nImport contracts and capability factories from package subpaths, create the required providers/repositories, then wire those capabilities in the consuming application's composition root. See `docs/USAGE.md`.\n\n## Persistence\n\nAccounts owns `CustomerAccount`, `OrganizationProfile`, `Membership`, and `Invitation`. Identity principal IDs are opaque external IDs; there is no Identity `User` relation or foreign key. Apply package-owned migrations from `migrations/` before using PostgreSQL repositories.\n''')

          (docs / "USAGE.md").write_text('''# Consuming @bke/accounts\n\n## Responsibility split\n\n`@bke/accounts` owns Accounts domain contracts, business logic, providers, PostgreSQL repositories, Prisma schema, migrations, and domain certification. The host owns HTTP/Next.js mapping, sessions/cookies, Identity principal verification/enrichment, Legal acceptance, email transport, audit transport, Commerce, Licensing, and application composition.\n\n## Direct capability composition\n\nImport the contract/capability factory and its PostgreSQL repository from package subpaths. Construct the repository with the application's Accounts database connection string, construct any package provider required by the capability, then register the resulting capability in the host composition root. Do not copy package logic back into the application.\n\n```ts\nimport { createAccountsAccountAccessCapability } from "@bke/accounts/logic/account-access";\nimport { createPostgresAccountsAccountAccessRepository } from "@bke/accounts/prisma/repositories/postgres-account-access-repository";\n\nconst accountAccess = createAccountsAccountAccessCapability(\n  createPostgresAccountsAccountAccessRepository(process.env.DATABASE_URL!),\n);\n```\n\nOther Accounts capabilities follow the same contract + logic factory + required provider/repository pattern. The package manifest enumerates certified capability IDs.\n\n## Prisma / migrations\n\nThe package owns `prisma/schema.prisma` and `migrations/`. Run package Prisma scripts with `DATABASE_URL` configured. Consumers must not reconstruct Accounts tables in a global business schema.\n\n## Cross-domain composition\n\nIdentity principal IDs enter Accounts as opaque strings. The host proves principal existence/email state where required. Registration remains Identity + Accounts + Legal composition. Commerce and Licensing consume Accounts authorization results instead of duplicating the role/capability matrix. Audit intents returned by Accounts are transported by the host.\n\n## Upgrade proof\n\nCertify the standalone package first, then prove the consuming host adapter/composition against that exact package candidate. Host tests prove wiring and compatibility; they do not re-prove package-owned domain invariants.\n''')
          PY

          npm install --package-lock-only --ignore-scripts

      - name: Commit extracted package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add @bke/accounts package-lock.json
          git commit -m "feat(accounts): extract certified @bke/accounts library"
          git push origin HEAD:feat/accounts-physical-extraction
