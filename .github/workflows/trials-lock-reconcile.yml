name: Trials Lock Reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - "@bke/trials/**"
      - ".github/workflows/trials-lock-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile from current workspace graph
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit only lockfile reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already reconciled."
            exit 0
          fi
          git commit -m "chore(trials): reconcile workspace lock"
          git push origin "HEAD:${{ github.head_ref }}"
