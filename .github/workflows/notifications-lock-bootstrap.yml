name: Notifications Lock Bootstrap

on:
  push:
    branches: [feat/library-notifications]
    paths:
      - "@bke/notifications/package.json"
      - ".github/workflows/notifications-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate workspace lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(notifications): update workspace lock"
          git push origin HEAD:feat/library-notifications
