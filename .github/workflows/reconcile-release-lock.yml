name: Reconcile release workspace lock

on:
  push:
    branches: [feat/licensing-commercial-context-composition]
    paths:
      - "@bke/accounts/package.json"
      - "@bke/catalog/package.json"
      - "@bke/licensing/package.json"
      - ".github/workflows/reconcile-release-lock.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/licensing-commercial-context-composition
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate workspace lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Certify release workspace versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const lock = require('./package-lock.json');
          const expected = {
            '@bke/accounts': '0.3.0',
            '@bke/catalog': '0.2.0',
            '@bke/commerce': '0.4.0',
            '@bke/licensing': '0.5.0',
          };
          for (const [name, version] of Object.entries(expected)) {
            if (lock.packages?.[name]?.version !== version) {
              throw new Error(`${name} lock version mismatch: expected ${version}, got ${lock.packages?.[name]?.version}`);
            }
          }
          NODE
      - name: Commit generated lock and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reconcile-release-lock.yml
          git add package-lock.json
          git diff --cached --quiet && { echo "::error::Lock reconciliation produced no commit."; exit 1; }
          git commit -m "chore: reconcile release workspace lock"
          git push origin HEAD:feat/licensing-commercial-context-composition
