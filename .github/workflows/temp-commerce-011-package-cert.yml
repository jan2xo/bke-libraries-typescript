name: Temporary Commerce 0.11 Package Certification

on:
  push:
    branches: [feat/commerce-subscription-lifecycle-management]
    paths:
      - ".github/workflows/temp-commerce-011-package-cert.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx @bke/commerce/tests/extraction.certify.ts
      - run: npm run typecheck --workspace=@bke/commerce
      - run: npm run test --workspace=@bke/commerce
      - name: Pack Commerce 0.11.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts .package-smoke
          mkdir -p artifacts .package-smoke
          version="$(node -p "require('./@bke/commerce/package.json').version")"
          test "$version" = "0.11.0"
          artifact="$(npm pack --workspace=@bke/commerce --pack-destination artifacts --silent | tail -n 1)"
          artifact="$(basename "$artifact")"
          test "$artifact" = "bke-commerce-0.11.0.tgz"
          tar -tzf "artifacts/$artifact" | grep -Fx 'package/contracts/subscription-lifecycle-management.contract.ts'
          tar -tzf "artifacts/$artifact" | grep -Fx 'package/logic/subscription-lifecycle-management.ts'
          tar -tzf "artifacts/$artifact" | grep -Fx 'package/prisma/repositories/postgres-subscription-lifecycle-management-repository.ts'
          echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"
      - name: Blank-consumer lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > .package-smoke/package.json <<JSON
          {
            "private": true,
            "type": "module",
            "dependencies": { "@bke/commerce": "file:../artifacts/$ARTIFACT" },
            "devDependencies": { "@types/node": "^24.3.0", "@types/pg": "^8.15.5", "tsx": "^4.20.5", "typescript": "^5.9.2" }
          }
          JSON
          cat > .package-smoke/tsconfig.json <<'JSON'
          {"compilerOptions":{"target":"ES2022","module":"ESNext","moduleResolution":"Bundler","strict":true,"noEmit":true,"skipLibCheck":true,"types":["node"]},"include":["smoke.ts"]}
          JSON
          cat > .package-smoke/smoke.ts <<'TS'
          import { COMMERCE_SUBSCRIPTION_LIFECYCLE_MANAGEMENT_CAPABILITY_ID } from "@bke/commerce/contracts/subscription-lifecycle-management.contract";
          import { createCommerceSubscriptionLifecycleManagementCapability } from "@bke/commerce/logic/subscription-lifecycle-management";
          import { createPostgresCommerceSubscriptionLifecycleRepository } from "@bke/commerce/prisma/repositories/postgres-subscription-lifecycle-management-repository";
          import { commerceModuleManifest } from "@bke/commerce/module.manifest";
          if (COMMERCE_SUBSCRIPTION_LIFECYCLE_MANAGEMENT_CAPABILITY_ID !== "bke.commerce.subscription-lifecycle-management.v1") throw new Error("Capability ID drifted.");
          if (!commerceModuleManifest.provides.includes(COMMERCE_SUBSCRIPTION_LIFECYCLE_MANAGEMENT_CAPABILITY_ID)) throw new Error("Lifecycle capability missing from manifest.");
          for (const value of [createCommerceSubscriptionLifecycleManagementCapability, createPostgresCommerceSubscriptionLifecycleRepository]) if (typeof value !== "function") throw new Error("Lifecycle export missing.");
          console.log("Packed @bke/commerce 0.11.0 lifecycle consumer smoke GREEN");
          TS
          npm install --prefix .package-smoke
          npx --prefix .package-smoke tsc -p .package-smoke/tsconfig.json --noEmit
          npx --prefix .package-smoke tsx .package-smoke/smoke.ts
      - run: git diff --check
