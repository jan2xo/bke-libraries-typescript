name: Temporary Catalog lock refresh

on:
  push:
    branches: [feat/catalog-product-id-policy]
    paths:
      - "@bke/catalog/package.json"
      - ".github/workflows/tmp-catalog-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/catalog-product-id-policy
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lock with npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify and commit only npm-generated lock metadata
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | grep -vE '^ M package-lock\.json$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "$unexpected"
            echo "::error::Lock refresh touched files other than package-lock.json"
            exit 1
          fi
          node - <<'NODE'
          const lock = require('./package-lock.json');
          if (lock.packages?.['@bke/catalog']?.version !== '0.4.0') {
            throw new Error('Expected @bke/catalog workspace lock version 0.4.0');
          }
          NODE
          if git diff --quiet -- package-lock.json; then
            echo "::error::Expected package-lock.json to change"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(catalog): sync 0.4.0 lock metadata"
          git push origin HEAD:feat/catalog-product-id-policy
