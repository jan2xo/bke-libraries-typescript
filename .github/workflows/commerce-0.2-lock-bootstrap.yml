name: Commerce 0.2 Lock Bootstrap

on:
  push:
    branches: [feat/commerce-checkout-0.2.0]
    paths:
      - ".github/workflows/commerce-0.2-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate workspace lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lock and retire bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/commerce-0.2-lock-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/commerce-0.2-lock-bootstrap.yml
          git commit -m "build(commerce): lock @bke/commerce 0.2.0"
          git push origin HEAD:feat/commerce-checkout-0.2.0
