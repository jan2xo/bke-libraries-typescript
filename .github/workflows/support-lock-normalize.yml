name: Temporary Support Lock Isolation

on:
  push:
    branches: [feat/support-v1-domain-extraction]

permissions:
  contents: write

jobs:
  isolate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feat/support-v1-domain-extraction }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Restore unrelated workspace metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'package-lock.json';
          const lock = JSON.parse(readFileSync(path, 'utf8'));
          lock.packages['@bke/identity'].version = '0.2.0';
          lock.packages['@bke/licensing'].version = '0.1.0';
          writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(support): isolate workspace lock change"
          git push origin HEAD:feat/support-v1-domain-extraction
