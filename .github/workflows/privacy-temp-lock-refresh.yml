name: Temporary Privacy Lock Refresh

on:
  push:
    branches: [feat/privacy-request-policy]
    paths:
      - ".github/workflows/privacy-temp-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/privacy-request-policy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate workspace lock with npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lock only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- @bke/privacy/package.json || true
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --exit-code -- . ':!package-lock.json' || {
            echo "::error::Unexpected staged files"
            exit 1
          }
          git commit -m "build(privacy): refresh workspace lock"
          git push origin HEAD:feat/privacy-request-policy
