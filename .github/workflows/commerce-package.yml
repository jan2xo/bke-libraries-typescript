name: BKE Library - Commerce Package

on:
  pull_request:
    branches: [main]
    paths:
      - "@bke/commerce/**"
      - "package-lock.json"
      - ".github/workflows/commerce-package.yml"
  push:
    branches: [main]
    paths:
      - "@bke/commerce/**"
      - "package-lock.json"
      - ".github/workflows/commerce-package.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Pack Commerce package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          version="$(node -p "require('./@bke/commerce/package.json').version")"
          expected="bke-commerce-${version}.tgz"
          artifact="$(npm pack --workspace=@bke/commerce --pack-destination artifacts --silent | tail -n 1)"
          artifact="$(basename "$artifact")"
          test "$artifact" = "$expected"
          test -s "artifacts/$artifact"
          sha256sum "artifacts/$artifact" | tee "artifacts/$artifact.sha256"
          echo "COMMERCE_VERSION=$version" >> "$GITHUB_ENV"
          echo "COMMERCE_ARTIFACT=$artifact" >> "$GITHUB_ENV"
      - name: Certify package contents
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf "artifacts/$COMMERCE_ARTIFACT" > artifacts/package-contents.txt
          for required in \
            package/package.json \
            package/module.manifest.ts \
            package/contracts/edition-plan-management.contract.ts \
            package/logic/edition-plan-management.ts \
            package/contracts/purchase-plan-pricing.contract.ts \
            package/contracts/purchase-plan-lookup.contract.ts \
            package/contracts/subscription-status-lookup.contract.ts \
            package/contracts/order-item-policy-lookup.contract.ts \
            package/contracts/renewal-checkout-pricing.contract.ts \
            package/contracts/subscription-renewal-plan.contract.ts \
            package/contracts/payment-outcome-reaction.contract.ts \
            package/contracts/subscription-lifecycle-management.contract.ts \
            package/contracts/public-promotion-preview.contract.ts \
            package/logic/subscription-status-lookup.ts \
            package/logic/renewal-checkout-pricing.ts \
            package/logic/renewal-checkout-pricing-repository.ts \
            package/logic/subscription-renewal-plan.ts \
            package/logic/payment-outcome-reaction.ts \
            package/logic/subscription-lifecycle-management.ts \
            package/logic/public-promotion-preview.ts \
            package/logic/public-promotion-preview-repository.ts \
            package/logic/offer-configuration.ts \
            package/prisma/repositories/postgres-subscription-status-lookup-repository.ts \
            package/prisma/repositories/postgres-subscription-lifecycle-management-repository.ts \
            package/prisma/repositories/postgres-order-item-policy-lookup-repository.ts \
            package/prisma/repositories/postgres-renewal-checkout-pricing-repository.ts \
            package/prisma/repositories/postgres-public-promotion-preview-repository.ts \
            package/contracts/offer-redemption.contract.ts \
            package/contracts/order-invoice-creation.contract.ts \
            package/contracts/checkout-offer-pricing.contract.ts \
            package/contracts/checkout-orchestration.contract.ts \
            package/contracts/settlement-reaction.contract.ts \
            package/contracts/settlement-fulfillment.contract.ts \
            package/contracts/zero-payment-fulfillment.contract.ts \
            package/logic/purchase-plan-pricing.ts \
            package/logic/purchase-plan-lookup.ts \
            package/logic/offer-redemption.ts \
            package/logic/order-invoice-creation.ts \
            package/logic/checkout-offer-pricing.ts \
            package/logic/checkout-offer-pricing-repository.ts \
            package/logic/checkout-orchestration.ts \
            package/logic/settlement-reaction.ts \
            package/logic/settlement-fulfillment.ts \
            package/logic/settlement-fulfillment-ports.ts \
            package/logic/settlement-fulfillment-repository.ts \
            package/logic/zero-payment-fulfillment.ts \
            package/logic/zero-payment-fulfillment-repository.ts \
            package/prisma/schema.prisma \
            package/prisma/repositories/postgres-purchase-plan-lookup-repository.ts \
            package/prisma/repositories/postgres-offer-redemption-repository.ts \
            package/prisma/repositories/postgres-order-invoice-creation-repository.ts \
            package/prisma/repositories/postgres-checkout-offer-pricing-repository.ts \
            package/prisma/repositories/postgres-settlement-reaction-repository.ts \
            package/prisma/repositories/postgres-settlement-fulfillment-repository.ts \
            package/prisma/repositories/postgres-zero-payment-fulfillment-repository.ts \
            package/migrations/0001_commerce_purchase_plan_baseline/migration.sql \
            package/migrations/0002_commerce_offers_redemptions/migration.sql \
            package/migrations/0003_commerce_orders_invoices/migration.sql \
            package/migrations/0004_commerce_subscription_baseline/migration.sql \
            package/migrations/0005_commerce_renewal_order_linkage/migration.sql \
            package/migrations/0006_commerce_claimable_fulfillment/migration.sql; do
            grep -Fx "$required" artifacts/package-contents.txt
          done
          if grep -E '^package/(tests|node_modules)/' artifacts/package-contents.txt; then
            echo '::error::Tests or dependency caches must not ship in @bke/commerce.'
            exit 1
          fi
      - name: Install tarball in blank consumer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .package-smoke
          mkdir -p .package-smoke
          cat > .package-smoke/package.json <<JSON
          {
            "private": true,
            "type": "module",
            "dependencies": { "@bke/commerce": "file:../artifacts/$COMMERCE_ARTIFACT" },
            "devDependencies": {
              "@types/node": "^24.3.0",
              "@types/pg": "^8.15.5",
              "tsx": "^4.20.5",
              "typescript": "^5.9.2"
            }
          }
          JSON
          cat > .package-smoke/tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "lib": ["ES2022", "DOM"],
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "types": ["node"]
            },
            "include": ["smoke.ts"]
          }
          JSON
          cat > .package-smoke/smoke.ts <<'TS'
          import { COMMERCE_EDITION_PLAN_MANAGEMENT_CAPABILITY_ID, type CommerceEditionPlanRepository } from "@bke/commerce/contracts/edition-plan-management.contract";
          import { createCommerceEdition, normalizeCommerceEditionPlanInput, synchronizeCommerceEditionPlans, validateCommerceEditionPlanSelection } from "@bke/commerce/logic/edition-plan-management";
          import { createCommerceSubscriptionStatusLookupCapability } from "@bke/commerce/logic/subscription-status-lookup";
          import { createPostgresCommerceSubscriptionStatusLookupRepository } from "@bke/commerce/prisma/repositories/postgres-subscription-status-lookup-repository";
          import type { CommerceSubscriptionStatusLookupCapability } from "@bke/commerce/contracts/subscription-status-lookup.contract";
          import { COMMERCE_ORDER_ITEM_POLICY_LOOKUP_CAPABILITY_ID, type CommerceOrderItemPolicyLookupCapability } from "@bke/commerce/contracts/order-item-policy-lookup.contract";
          import { createPostgresCommerceOrderItemPolicyLookupCapability } from "@bke/commerce/prisma/repositories/postgres-order-item-policy-lookup-repository";
          import { COMMERCE_RENEWAL_CHECKOUT_PRICING_CAPABILITY_ID } from "@bke/commerce/contracts/renewal-checkout-pricing.contract";
          import { createCommerceRenewalCheckoutPricingCapability } from "@bke/commerce/logic/renewal-checkout-pricing";
          import { createPostgresCommerceRenewalCheckoutPricingRepository } from "@bke/commerce/prisma/repositories/postgres-renewal-checkout-pricing-repository";
          import { COMMERCE_SUBSCRIPTION_RENEWAL_PLAN_CAPABILITY_ID } from "@bke/commerce/contracts/subscription-renewal-plan.contract";
          import { createCommerceSubscriptionRenewalPlanCapability } from "@bke/commerce/logic/subscription-renewal-plan";
          import { COMMERCE_PAYMENT_OUTCOME_REACTION_CAPABILITY_ID } from "@bke/commerce/contracts/payment-outcome-reaction.contract";
          import { createCommercePaymentOutcomeReactionCapability } from "@bke/commerce/logic/payment-outcome-reaction";
          import { COMMERCE_SUBSCRIPTION_LIFECYCLE_MANAGEMENT_CAPABILITY_ID } from "@bke/commerce/contracts/subscription-lifecycle-management.contract";
          import { createCommerceSubscriptionLifecycleManagementCapability } from "@bke/commerce/logic/subscription-lifecycle-management";
          import { createPostgresCommerceSubscriptionLifecycleRepository } from "@bke/commerce/prisma/repositories/postgres-subscription-lifecycle-management-repository";
          import { COMMERCE_PUBLIC_PROMOTION_PREVIEW_CAPABILITY_ID } from "@bke/commerce/contracts/public-promotion-preview.contract";
          import { createCommercePublicPromotionPreviewCapability } from "@bke/commerce/logic/public-promotion-preview";
          import { createPostgresCommercePublicPromotionPreviewRepository } from "@bke/commerce/prisma/repositories/postgres-public-promotion-preview-repository";
          import { validateCommerceOfferConfiguration } from "@bke/commerce/logic/offer-configuration";
          import { COMMERCE_PURCHASE_PLAN_PRICING_CAPABILITY_ID } from "@bke/commerce/contracts/purchase-plan-pricing.contract";
          import { COMMERCE_PURCHASE_PLAN_LOOKUP_CAPABILITY_ID } from "@bke/commerce/contracts/purchase-plan-lookup.contract";
          import { COMMERCE_OFFER_REDEMPTION_CAPABILITY_ID } from "@bke/commerce/contracts/offer-redemption.contract";
          import { COMMERCE_ORDER_INVOICE_CREATION_CAPABILITY_ID } from "@bke/commerce/contracts/order-invoice-creation.contract";
          import { COMMERCE_CHECKOUT_OFFER_PRICING_CAPABILITY_ID } from "@bke/commerce/contracts/checkout-offer-pricing.contract";
          import { COMMERCE_CHECKOUT_ORCHESTRATION_CAPABILITY_ID } from "@bke/commerce/contracts/checkout-orchestration.contract";
          import { COMMERCE_SETTLEMENT_REACTION_CAPABILITY_ID } from "@bke/commerce/contracts/settlement-reaction.contract";
          import { COMMERCE_SETTLEMENT_FULFILLMENT_CAPABILITY_ID } from "@bke/commerce/contracts/settlement-fulfillment.contract";
          import { COMMERCE_ZERO_PAYMENT_FULFILLMENT_CAPABILITY_ID } from "@bke/commerce/contracts/zero-payment-fulfillment.contract";
          import { createCommercePurchasePlanPricingCapability } from "@bke/commerce/logic/purchase-plan-pricing";
          import { createCommercePurchasePlanLookupCapability } from "@bke/commerce/logic/purchase-plan-lookup";
          import { createCommerceOfferRedemptionCapability } from "@bke/commerce/logic/offer-redemption";
          import { createCommerceOrderInvoiceCreationCapability } from "@bke/commerce/logic/order-invoice-creation";
          import { createCommerceCheckoutOfferPricingCapability } from "@bke/commerce/logic/checkout-offer-pricing";
          import { createCommerceCheckoutOrchestrationCapability } from "@bke/commerce/logic/checkout-orchestration";
          import { createCommerceSettlementReactionCapability } from "@bke/commerce/logic/settlement-reaction";
          import { createCommerceSettlementFulfillmentCapability } from "@bke/commerce/logic/settlement-fulfillment";
          import { createCommerceZeroPaymentFulfillmentCapability } from "@bke/commerce/logic/zero-payment-fulfillment";
          import { createPostgresCommercePurchasePlanLookupRepository } from "@bke/commerce/prisma/repositories/postgres-purchase-plan-lookup-repository";
          import { createPostgresCommerceCheckoutOfferPricingRepository } from "@bke/commerce/prisma/repositories/postgres-checkout-offer-pricing-repository";
          import { createPostgresCommerceSettlementFulfillmentRepository } from "@bke/commerce/prisma/repositories/postgres-settlement-fulfillment-repository";
          import { createPostgresCommerceZeroPaymentFulfillmentRepository } from "@bke/commerce/prisma/repositories/postgres-zero-payment-fulfillment-repository";
          import { commerceModuleManifest } from "@bke/commerce/module.manifest";
          const ids = [COMMERCE_PURCHASE_PLAN_PRICING_CAPABILITY_ID, COMMERCE_PURCHASE_PLAN_LOOKUP_CAPABILITY_ID, COMMERCE_OFFER_REDEMPTION_CAPABILITY_ID, COMMERCE_ORDER_INVOICE_CREATION_CAPABILITY_ID, COMMERCE_CHECKOUT_OFFER_PRICING_CAPABILITY_ID, COMMERCE_CHECKOUT_ORCHESTRATION_CAPABILITY_ID, COMMERCE_SETTLEMENT_REACTION_CAPABILITY_ID, COMMERCE_SETTLEMENT_FULFILLMENT_CAPABILITY_ID, COMMERCE_ZERO_PAYMENT_FULFILLMENT_CAPABILITY_ID, COMMERCE_ORDER_ITEM_POLICY_LOOKUP_CAPABILITY_ID, COMMERCE_RENEWAL_CHECKOUT_PRICING_CAPABILITY_ID, COMMERCE_SUBSCRIPTION_RENEWAL_PLAN_CAPABILITY_ID, COMMERCE_PUBLIC_PROMOTION_PREVIEW_CAPABILITY_ID, COMMERCE_EDITION_PLAN_MANAGEMENT_CAPABILITY_ID, COMMERCE_PAYMENT_OUTCOME_REACTION_CAPABILITY_ID, COMMERCE_SUBSCRIPTION_LIFECYCLE_MANAGEMENT_CAPABILITY_ID];
          if (ids.length !== 16 || commerceModuleManifest.moduleId !== "commerce" || commerceModuleManifest.needs.length !== 0 || commerceModuleManifest.provides.length !== 15 || !commerceModuleManifest.provides.includes(COMMERCE_SETTLEMENT_FULFILLMENT_CAPABILITY_ID) || !commerceModuleManifest.provides.includes(COMMERCE_SUBSCRIPTION_RENEWAL_PLAN_CAPABILITY_ID) || !commerceModuleManifest.provides.includes(COMMERCE_PAYMENT_OUTCOME_REACTION_CAPABILITY_ID) || !commerceModuleManifest.provides.includes(COMMERCE_SUBSCRIPTION_LIFECYCLE_MANAGEMENT_CAPABILITY_ID)) throw new Error("Unexpected Commerce package identity.");
          for (const value of [createCommerceEdition, normalizeCommerceEditionPlanInput, synchronizeCommerceEditionPlans, validateCommerceEditionPlanSelection, createCommercePurchasePlanPricingCapability, createCommercePurchasePlanLookupCapability, createCommerceOfferRedemptionCapability, createCommerceOrderInvoiceCreationCapability, createCommerceCheckoutOfferPricingCapability, createCommerceCheckoutOrchestrationCapability, createCommerceSettlementReactionCapability, createCommerceSettlementFulfillmentCapability, createCommerceZeroPaymentFulfillmentCapability, createCommerceRenewalCheckoutPricingCapability, createCommerceSubscriptionRenewalPlanCapability, createCommercePaymentOutcomeReactionCapability, createCommerceSubscriptionLifecycleManagementCapability, createCommercePublicPromotionPreviewCapability, createPostgresCommercePurchasePlanLookupRepository, createPostgresCommerceCheckoutOfferPricingRepository, createPostgresCommerceSettlementFulfillmentRepository, createPostgresCommerceZeroPaymentFulfillmentRepository, createPostgresCommerceOrderItemPolicyLookupCapability, createPostgresCommerceRenewalCheckoutPricingRepository, createPostgresCommerceSubscriptionLifecycleRepository, createPostgresCommercePublicPromotionPreviewRepository, validateCommerceOfferConfiguration]) {
            if (typeof value !== "function") throw new Error("Packed Commerce consumer exports are incomplete.");
          }
          const renewalPlan = createCommerceSubscriptionRenewalPlanCapability().plan({ currentPeriodEnd: new Date("2026-10-01T00:00:00.000Z"), intervalUnit: "MONTH", intervalCount: 1, now: new Date("2026-09-16T00:00:00.000Z"), settlementOfferId: "offer-1", discountedCyclesTotal: 3, discountedCyclesConsumed: 1 });
          if (renewalPlan.status !== "PLANNED" || renewalPlan.nextDiscountedCyclesConsumed !== 2 || !renewalPlan.discountedCycleConsumed) throw new Error("Packed subscription renewal plan drifted.");
          const paidPlan = createCommercePaymentOutcomeReactionCapability().plan({ kind: "PAYMENT_PAID", orderStatus: "PENDING", hasPaymentAttempt: true });
          if (paidPlan.status !== "APPLY" || paidPlan.kind !== "PAYMENT_PAID" || paidPlan.auditAction !== "PAYMENT_SETTLED") throw new Error("Packed payment-outcome policy drifted.");
          const lifecycle = createCommerceSubscriptionLifecycleManagementCapability({ start: async () => { throw new Error("not called"); }, renew: async () => null });
          if (typeof lifecycle.start !== "function" || typeof lifecycle.renew !== "function") throw new Error("Packed subscription lifecycle capability missing.");
          const editionRepository: CommerceEditionPlanRepository = {
            createEdition: async () => ({ id: "edition" }),
            upsertPurchasePlan: async (input) => ({ id: input.type === "MONTHLY" ? "monthly" : input.type.toLowerCase() }),
          };
          const edition = await createCommerceEdition(editionRepository, "product", { name: "Standard", slug: "standard", features: [], maxUsers: 1, maxDevicesPerUser: 1, updatePolicy: "ACTIVE_TERM", active: true, plans: { perpetual: { enabled: true, amountMinor: 100 }, monthly: { enabled: false }, annual: { enabled: false } } });
          if (edition.edition.id !== "edition") throw new Error("Packed edition-plan management failed.");
          const subscriptionLookup: CommerceSubscriptionStatusLookupCapability = createCommerceSubscriptionStatusLookupCapability({ findById: async () => null });
          if ((await subscriptionLookup.find({ subscriptionId: "unknown" })).status !== "NOT_FOUND") throw new Error("Packed subscription lookup failed.");
          if (typeof createPostgresCommerceSubscriptionStatusLookupRepository !== "function") throw new Error("Packed subscription repository missing.");
          const orderItemPolicyLookup: CommerceOrderItemPolicyLookupCapability = createPostgresCommerceOrderItemPolicyLookupCapability("postgresql://unused:unused@localhost/unused");
          if (typeof orderItemPolicyLookup.findByOrderItemId !== "function") throw new Error("Packed order-item policy lookup missing.");
          console.log("Packed @bke/commerce consumer smoke GREEN");
          TS
          npm install --prefix .package-smoke
          npx --prefix .package-smoke tsc -p .package-smoke/tsconfig.json --noEmit
          npx --prefix .package-smoke tsx .package-smoke/smoke.ts
      - name: Upload certified package evidence
        uses: actions/upload-artifact@v7
        with:
          name: bke-commerce-${{ env.COMMERCE_VERSION }}
          path: |
            artifacts/${{ env.COMMERCE_ARTIFACT }}
            artifacts/${{ env.COMMERCE_ARTIFACT }}.sha256
            artifacts/package-contents.txt
          if-no-files-found: error
      - name: Create immutable Commerce release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./@bke/commerce/package.json').version")"
          tag="commerce-v${version}"
          package_changed=false
          if [[ "${{ github.event_name }}" == "push" ]] && [[ -n "${BEFORE_SHA:-}" ]] && ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- @bke/commerce/package.json; then package_changed=true; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$package_changed" == "true" ]]; then
              echo "::error::Release $tag already exists. Package versions are immutable; bump @bke/commerce version."
              exit 1
            fi
            echo "Release $tag already exists and package version is unchanged."
            exit 0
          fi
          gh release create "$tag" \
            "artifacts/$COMMERCE_ARTIFACT" \
            "artifacts/$COMMERCE_ARTIFACT.sha256" \
            --target "$GITHUB_SHA" \
            --title "@bke/commerce v${version}" \
            --notes "Certified BKE Commerce package artifact. Commerce owns canonical pricing, checkout and settlement behavior, transaction-safe subscription renewal planning, payment-outcome reaction, and subscription lifecycle persistence. Commerce source, behavior, persistence, migration, and package gates passed before release creation."
