name: Commerce 0.3 Lock Bootstrap

on:
  push:
    branches:
      - feat/commerce-checkout-offers-0.3.0
    paths:
      - ".github/workflows/commerce-0.3-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-checkout-offers-0.3.0
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh workspace lock
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
      - name: Commit Commerce 0.3 lock
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/commerce-0.3-lock-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/commerce-0.3-lock-bootstrap.yml
          if git diff --cached --quiet; then
            echo "No lock change required."
            exit 0
          fi
          git commit -m "build(commerce): lock @bke/commerce 0.3.0"
          git push origin HEAD:feat/commerce-checkout-offers-0.3.0
