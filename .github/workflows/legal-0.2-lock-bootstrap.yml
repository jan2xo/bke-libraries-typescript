name: Legal 0.2 Lock Bootstrap
on:
  push:
    branches: [feat/legal-checkout-requirements-0.2.0]
    paths:
      - ".github/workflows/legal-0.2-lock-bootstrap.yml"
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/legal-checkout-requirements-0.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate workspace lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lock and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/legal-0.2-lock-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/legal-0.2-lock-bootstrap.yml
          git commit -m "build(legal): lock @bke/legal 0.2.0"
          git push origin HEAD:feat/legal-checkout-requirements-0.2.0
