name: Reconcile transfer release versions

on:
  push:
    branches: [feat/licensing-transfer-policy-facts]
    paths:
      - ".github/workflows/reconcile-transfer-release.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/licensing-transfer-policy-facts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile package versions and release evidence
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set version=0.5.0 --workspace=@bke/commerce
          npm pkg set version=0.5.0 --workspace=@bke/licensing
          sed -i 's/0\.4\.0/0.5.0/g' .github/workflows/commerce-package.yml
          npm install --package-lock-only --ignore-scripts
          node <<'NODE'
          const lock = require('./package-lock.json');
          const manifests = {
            '@bke/commerce': require('./@bke/commerce/package.json').version,
            '@bke/licensing': require('./@bke/licensing/package.json').version,
          };
          for (const [name, version] of Object.entries(manifests)) {
            if (version !== '0.5.0') throw new Error(`${name} manifest must be 0.5.0, got ${version}`);
            if (lock.packages?.[name]?.version !== version) {
              throw new Error(`${name} lock version mismatch: ${lock.packages?.[name]?.version}`);
            }
          }
          NODE
          grep -F 'bke-commerce-0.5.0.tgz' .github/workflows/commerce-package.yml >/dev/null
          if grep -F 'bke-commerce-0.4.0' .github/workflows/commerce-package.yml >/dev/null; then
            echo '::error::Stale Commerce 0.4 package evidence remains.'
            exit 1
          fi
      - name: Commit reconciliation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reconcile-transfer-release.yml
          git add @bke/commerce/package.json @bke/licensing/package.json .github/workflows/commerce-package.yml package-lock.json
          git diff --cached --quiet && { echo '::error::Release reconciliation produced no commit.'; exit 1; }
          git commit -m "chore: version transfer policy release artifacts"
          git push origin HEAD:feat/licensing-transfer-policy-facts
