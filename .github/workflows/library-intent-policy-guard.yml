name: BKE Library - Intentional CI Policy Guard

# Cheap policy-only PR check; heavy modules run only by deliberate dispatch.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "docs/INTENTIONAL-LIBRARY-CI-MIGRATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Intentional CI policy guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Certify offline Licensing release-readiness comparator
        run: |
          node --test scripts/licensing/check-release-readiness.test.mjs
          node --test scripts/licensing/check-publication-plan.test.mjs
          node --test scripts/licensing/chatops-release-control.test.mjs
      - name: Verify explicit module CI and absent automatic publication
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const fail = (reason) => { throw new Error("LIBRARY_CI_POLICY: " + reason); };
          const directory = ".github/workflows";
          const files = fs.readdirSync(directory).filter(f => f.endsWith(".yml"));
          const cheap = new Set([
            "library-intent-policy-guard.yml",
            "licensing-policy-guard.yml",
            "licensing-certify-router.yml",
            "licensing-chatops-control.yml",
          ]);
          const migrated = new Set([
            "accounts-package.yml", "accounts.yml",
            "catalog-package.yml", "catalog.yml",
            "commerce-package.yml", "commerce.yml",
            "entitlements-package.yml", "entitlements.yml",
            "extract-identity.yml",
            "identity-package.yml", "identity.yml",
            "legal-package.yml", "legal.yml",
            "licensing-commercial-context.yml",
            "licensing-package.yml", "licensing.yml",
            "notifications-package.yml", "notifications.yml",
            "payments-package.yml", "payments.yml",
            "privacy.yml",
            "support-package.yml", "support.yml",
            "trials.yml",
          ]);
          const publicationRemoved = new Set([
            "accounts-package.yml", "catalog-package.yml",
            "commerce-package.yml", "entitlements-package.yml",
            "identity-package.yml", "legal-package.yml",
            "notifications-package.yml", "payments-package.yml",
            "privacy.yml", "support-package.yml", "trials.yml",
          ]);
          for (const filename of [...migrated, ...cheap, ...publicationRemoved]) {
            if (!files.includes(filename)) fail("Missing expected workflow: " + filename);
          }
          let explicit = 0;
          for (const filename of files) {
            if (cheap.has(filename)) continue;
            const source = fs.readFileSync(path.join(directory, filename), "utf8");
            const marker = /^on:\s*$/m.exec(source);
            if (!marker) fail(filename + " missing on: trigger section");
            const afterOn = source.slice(marker.index + marker[0].length);
            const next = /^(?:permissions|concurrency|jobs):/m.exec(afterOn);
            if (!next) fail(filename + " missing top-level workflow boundary");
            const triggerSection = afterOn.slice(0, next.index);
            const triggers = [...triggerSection.matchAll(/^  ([a-z_]+):/gm)].map(m => m[1]);
            if (!triggers.length || triggers.some(t => t !== "workflow_dispatch" && t !== "workflow_call")) {
              fail(filename + " heavy workflow has an implicit trigger: " + triggers.join(","));
            }
            if (publicationRemoved.has(filename)) {
              if (!/^permissions:\s*\n  contents:\s*read\s*$/m.test(source)) {
                fail(filename + " package certification requires a read-only token");
              }
              if (/\bgh\s+release\b|\bnpm\s+publish\b|\bGH_TOKEN\b|\bcreateRelease\b|\bcreateRef\b|\bcontents:\s*write\b/i.test(source)) {
                fail(filename + " package certification still contains publication authority");
              }
            }
            explicit++;
          }
          if (explicit < migrated.size) fail("Expected active heavy module owners were excluded");
          const router = fs.readFileSync(path.join(directory, "licensing-certify-router.yml"), "utf8");
          if (!/issue_comment:/.test(router) || !/context\.payload\.comment\?\.user\?\.login !== context\.repo\.owner/.test(router)) {
            fail("Owner-only explicit Licensing certification router was weakened");
          }
          const chatops = fs.readFileSync(path.join(directory, "licensing-chatops-control.yml"), "utf8");
          const chatopsParser = fs.readFileSync("scripts/licensing/chatops-release-control.mjs", "utf8");
          const chatopsTests = fs.readFileSync("scripts/licensing/chatops-release-control.test.mjs", "utf8");
          const routerRequirements = [
            "issue_comment:", "types: [created]",
            "github.event.issue.number == 100",
            "!github.event.issue.pull_request",
            "github.rest.issues.getComment(",
            "github.rest.issues.get(",
            "github.rest.repos.getBranch(",
            "authorizeLicensingChatOpsCommand",
            "github.rest.actions.createWorkflowDispatch(",
            "licensing-release-readiness.yml",
            "licensing-release-publication.yml",
            "READINESS_RUN_NOT_AUTHORIZED_FOR_EXACT_MAIN",
            "MISSING_OR_AMBIGUOUS_READINESS_ARTIFACT",
            "LICENSING_V010_RELEASE_COLLISION",
          ];
          if (!/^permissions:\s*\n  contents:\s*read\s*$/m.test(chatops) ||
              !/^    permissions:\s*\n      contents:\s*read\s*\n      issues:\s*read\s*\n      actions:\s*write\s*$/m.test(chatops) ||
              /contents:\s*write|\bnpm\s+publish\b|\bgh\s+release\b|\bcreateRelease\b|\bcreateRef\b/.test(chatops) ||
              chatops.includes("pull_request:\n") ||
              chatops.includes("  push:\n")) {
            fail("ChatOps router must be cheap owner-issued issue_comment with scoped actions:write only");
          }
          for (const token of routerRequirements) {
            if (!chatops.includes(token)) fail("Missing hardened ChatOps router rule: " + token);
          }
          if (!chatopsParser.includes("const OWNER_ID = 163499503") ||
              !chatopsParser.includes("const CONTROL_ISSUE_ID = 6344112785") ||
              !chatopsParser.includes("COMMENT_EXPIRED") ||
              !chatopsParser.includes("UNSUPPORTED_COMMAND") ||
              !chatopsTests.includes("owner-only licensing release ChatOps")) {
            fail("ChatOps parser, owner identity or negative tests are missing");
          }
          const readiness = fs.readFileSync(path.join(directory, "licensing-release-readiness.yml"), "utf8");
          if (!/^on:\s*\n  workflow_dispatch:\s*$/m.test(readiness.slice(0, readiness.indexOf("    inputs:")))) {
            fail("Licensing release readiness must require manual workflow_dispatch");
          }
          if (!/^permissions:\s*\n  contents:\s*read\s*\n  actions:\s*read\s*$/m.test(readiness)) {
            fail("Licensing release readiness must have only read-only GitHub permissions");
          }
          if (/\bgh\s+release\b|\bnpm\s+publish\b|\bGH_TOKEN\b|\bcreateRelease\b|\bcreateRef\b|\bcontents:\s*write\b/i.test(readiness)) {
            fail("Licensing release readiness must not publish or grant write permissions");
          }
          if (!readiness.includes("github.rest.pulls.get(") ||
              !readiness.includes('pr.head.sha !== process.env.CERTIFIED_SOURCE_SHA') ||
              !readiness.includes('refs/pull/') ||
              !/getWorkflowRun\(/.test(readiness) ||
              !/listWorkflowRunArtifacts\(/.test(readiness) ||
              !/github\.rest\.repos\.getReleaseByTag\(/.test(readiness) ||
              !/certified_package_tree/.test(readiness) ||
              !/sha256sum/.test(readiness) ||
              !/check-release-readiness\.mjs/.test(readiness)) {
            fail("Read-only readiness is missing release, Git tree, source run or archive proof");
          }
          const publication = fs.readFileSync("scripts/licensing/check-publication-plan.mjs", "utf8");
          const publicationTests = fs.readFileSync("scripts/licensing/check-publication-plan.test.mjs", "utf8");
          if (!publication.includes('state: "PUBLICATION_NOT_AUTHORIZED"') ||
              !publication.includes('LICENSING_PUBLICATION_PLAN_') ||
              !publicationTests.includes("immutable licensing publication plan")) {
            fail("Source-only publication plan and fail-closed tests are required");
          }
          if (/\bfetch\s*\(|\bhttps\.request\s*\(|\bcreateRelease\s*\(|\bcreateRef\s*\(|\buploadReleaseAsset\s*\(|\bgh\s+release\b|\bnpm\s+publish\b|\bGH_TOKEN\b|\bcontents:\s*write\b/i.test(publication)) {
            fail("Source-only publication comparator must not gain network or release-write capability");
          }
          const publisher = fs.readFileSync(path.join(directory, "licensing-release-publication.yml"), "utf8");
          if (!/^on:\s*\n  workflow_dispatch:\s*$/m.test(publisher.slice(0, publisher.indexOf("    inputs:")))) {
            fail("Licensing 0.10.0 publication must be a manual workflow_dispatch only");
          }
          if (!/^permissions:\s*\n  contents:\s*write\s*\n  actions:\s*read\s*$/m.test(publisher)) {
            fail("Only Licensing manual publisher may have scoped contents:write, actions:read");
          }
          const mandatory = [
            "github.repository == 'jan2xo/bke-libraries-typescript'",
            "github.actor == 'jan2xo'",
            "github.actor == 'github-actions[bot]'",
            "authorization_comment_id:",
            "comment.user?.id !== 163499503",
            "UNVERIFIABLE_OR_STALE_OWNER_RELEASE_COMMAND",
            "github.ref == 'refs/heads/main'",
            "confirm_release_tag:",
            "confirm_immutable_releases:",
            'test "$CONFIRM_IMMUTABILITY" = "GITHUB_IMMUTABLE_RELEASES_ENABLED"',
            "published.immutable !== true",
            'test "$CONFIRM_RELEASE_TAG" = "$RELEASE_TAG"',
            'test "$GITHUB_SHA" = "$EXPECTED_MAIN_SHA"',
            "getWorkflowRun(", "listWorkflowRunArtifacts(",
            "getReleaseByTag(", "getRef(",
            "refs/pull/94/head",
            "github.rest.repos.getBranch(",
            "actions/download-artifact@v4",
            "check-publication-plan.mjs",
            "verified-readiness/licensing-release-readiness.json",
            "verified-original/licensing-package-provenance.json",
            "ORIGINAL_PACKAGE_SHA256",
            "gh api -X POST",
            "gh release create",
            "gh release upload",
            "gh release download",
            "cmp ",
            "gh release edit",
            "--draft=false",
            "POST_PUBLICATION_RELEASE_MISMATCH",
          ];
          for (const token of mandatory) {
            if (!publisher.includes(token)) fail("Missing immutable release guard: " + token);
          }
          if (/^\s{2}(?:push|pull_request|schedule|issue_comment|release|workflow_run):/m.test(
              publisher.slice(publisher.indexOf("on:"), publisher.indexOf("permissions:")))) {
            fail("Manual Licensing release must never have an implicit trigger");
          }
          if (/\bnpm\s+publish\b|\bforce\s*:\s*true\b|\b--clobber\b|\bgh\s+release\s+delete\b|\bgh\s+api\s+-X\s+DELETE\b/i.test(publisher)) {
            fail("Licensing release workflow contains forbidden publication override / npm mutation");
          }
          console.log("PASS: " + explicit + " heavyweight library workflows are explicit-only; "
            + publicationRemoved.size + " historical package release paths are read-only.");
          NODE
