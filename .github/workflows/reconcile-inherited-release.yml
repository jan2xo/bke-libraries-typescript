name: Reconcile inherited release metadata

on:
  push:
    branches: [feat/licensing-transfer-policy-facts]
    paths:
      - ".github/workflows/reconcile-inherited-release.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/licensing-transfer-policy-facts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile inherited released package metadata
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set version=0.2.0 --workspace=@bke/catalog
          npm install --package-lock-only --ignore-scripts
          node <<'NODE'
          const lock = require('./package-lock.json');
          const expected = {
            '@bke/catalog': '0.2.0',
            '@bke/commerce': '0.5.0',
            '@bke/licensing': '0.5.0',
          };
          for (const [name, version] of Object.entries(expected)) {
            const manifest = require(`./${name}/package.json`).version;
            if (manifest !== version) throw new Error(`${name} manifest expected ${version}, got ${manifest}`);
            if (lock.packages?.[name]?.version !== version) throw new Error(`${name} lock expected ${version}, got ${lock.packages?.[name]?.version}`);
          }
          NODE
      - name: Commit inherited release reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add @bke/catalog/package.json package-lock.json
          git diff --cached --quiet && { echo '::error::Inherited release reconciliation produced no commit.'; exit 1; }
          git commit -m "chore: reconcile inherited release metadata"
          git push origin HEAD:feat/licensing-transfer-policy-facts
