name: BKE Library - Accounts Package

on:
  pull_request:
    branches: [main]
    paths:
      - "@bke/accounts/package.json"
      - ".github/workflows/accounts-package.yml"
  push:
    branches: [main]
    paths:
      - "@bke/accounts/package.json"
      - ".github/workflows/accounts-package.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Pack Accounts package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          artifact="$(npm pack --workspace=@bke/accounts --pack-destination artifacts --silent | tail -n 1)"
          artifact="$(basename "$artifact")"
          test "$artifact" = "bke-accounts-0.2.0.tgz"
          test -s "artifacts/$artifact"
          sha256sum "artifacts/$artifact" | tee "artifacts/$artifact.sha256"
          echo "ACCOUNTS_ARTIFACT=$artifact" >> "$GITHUB_ENV"

      - name: Certify package contents
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf "artifacts/$ACCOUNTS_ARTIFACT" > artifacts/package-contents.txt

          grep -Fx 'package/package.json' artifacts/package-contents.txt
          grep -Fx 'package/module.manifest.ts' artifacts/package-contents.txt
          grep -Fx 'package/contracts/account-access.contract.ts' artifacts/package-contents.txt
          grep -Fx 'package/contracts/purchase-access.contract.ts' artifacts/package-contents.txt
          grep -Fx 'package/logic/account-access.ts' artifacts/package-contents.txt
          grep -Fx 'package/logic/purchase-access.ts' artifacts/package-contents.txt
          grep -Fx 'package/providers/crypto-accounts-id-provider.ts' artifacts/package-contents.txt
          grep -Fx 'package/prisma/schema.prisma' artifacts/package-contents.txt
          grep -Fx 'package/prisma/repositories/postgres-account-access-repository.ts' artifacts/package-contents.txt
          grep -Fx 'package/migrations/0001_accounts_baseline/migration.sql' artifacts/package-contents.txt
          grep -Fx 'package/docs/USAGE.md' artifacts/package-contents.txt

          if grep -E '^package/(tests|node_modules)/' artifacts/package-contents.txt; then
            echo '::error::Tests or dependency caches must not ship in @bke/accounts.'
            exit 1
          fi

      - name: Install tarball in blank consumer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .package-smoke
          mkdir -p .package-smoke
          cat > .package-smoke/package.json <<JSON
          {
            "private": true,
            "type": "module",
            "dependencies": {
              "@bke/accounts": "file:../artifacts/$ACCOUNTS_ARTIFACT"
            },
            "devDependencies": {
              "@types/node": "^24.3.0",
              "@types/pg": "^8.15.5",
              "tsx": "^4.20.5",
              "typescript": "^5.9.2"
            }
          }
          JSON
          cat > .package-smoke/tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "types": ["node"]
            },
            "include": ["smoke.ts"]
          }
          JSON
          cat > .package-smoke/smoke.ts <<'TS'
          import { ACCOUNTS_ACCOUNT_ACCESS_CAPABILITY_ID } from "@bke/accounts/contracts/account-access.contract";
          import { ACCOUNTS_PURCHASE_ACCESS_CAPABILITY_ID } from "@bke/accounts/contracts/purchase-access.contract";
          import { createAccountsAccountAccessCapability } from "@bke/accounts/logic/account-access";
          import { createAccountsPurchaseAccessCapability } from "@bke/accounts/logic/purchase-access";
          import { createCryptoAccountsIdProvider } from "@bke/accounts/providers/crypto-accounts-id-provider";
          import { createPostgresAccountsAccountAccessRepository } from "@bke/accounts/prisma/repositories/postgres-account-access-repository";
          import { accountsModuleManifest } from "@bke/accounts/module.manifest";

          if (ACCOUNTS_ACCOUNT_ACCESS_CAPABILITY_ID !== "bke.accounts.account-access.v1") {
            throw new Error("Unexpected Accounts account-access capability id from packed consumer surface.");
          }
          if (ACCOUNTS_PURCHASE_ACCESS_CAPABILITY_ID !== "bke.accounts.purchase-access.v1") {
            throw new Error("Unexpected Accounts purchase-access capability id from packed consumer surface.");
          }
          if (accountsModuleManifest.moduleId !== "accounts") {
            throw new Error("Unexpected Accounts manifest moduleId from packed consumer surface.");
          }
          if (!accountsModuleManifest.provides.includes(ACCOUNTS_PURCHASE_ACCESS_CAPABILITY_ID)) {
            throw new Error("Accounts manifest does not publish purchase access.");
          }
          if (
            typeof createAccountsAccountAccessCapability !== "function" ||
            typeof createAccountsPurchaseAccessCapability !== "function" ||
            typeof createCryptoAccountsIdProvider !== "function" ||
            typeof createPostgresAccountsAccountAccessRepository !== "function"
          ) {
            throw new Error("Packed Accounts consumer exports are incomplete.");
          }

          console.log("Packed @bke/accounts consumer smoke GREEN");
          TS
          npm install --prefix .package-smoke
          npx --prefix .package-smoke tsc -p .package-smoke/tsconfig.json --noEmit
          npx --prefix .package-smoke tsx .package-smoke/smoke.ts

      - name: Upload certified package evidence
        uses: actions/upload-artifact@v7
        with:
          name: bke-accounts-0.2.0
          path: |
            artifacts/bke-accounts-0.2.0.tgz
            artifacts/bke-accounts-0.2.0.tgz.sha256
            artifacts/package-contents.txt
          if-no-files-found: error

      - name: Create immutable Accounts release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./@bke/accounts/package.json').version")"
          tag="accounts-v${version}"

          package_changed=false
          if [[ "${{ github.event_name }}" == "push" ]] && [[ -n "${BEFORE_SHA:-}" ]] && ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- @bke/accounts/package.json; then
            package_changed=true
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$package_changed" == "true" ]]; then
              echo "::error::Release $tag already exists. Package versions are immutable; bump @bke/accounts version."
              exit 1
            fi
            echo "Release $tag already exists and package version is unchanged."
            exit 0
          fi

          gh release create "$tag" \
            "artifacts/$ACCOUNTS_ARTIFACT" \
            "artifacts/$ACCOUNTS_ARTIFACT.sha256" \
            --target "$GITHUB_SHA" \
            --title "@bke/accounts v${version}" \
            --notes "Certified BKE Accounts package artifact. Source, persistence, behavior, and package gates passed before release creation."
