name: Payments lock refresh

on:
  push:
    branches:
      - feat/payments-refund-by-commercial-reference

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-refund-by-commercial-reference
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh workspace lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lock if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lock changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(payments): sync 0.3.0 workspace lock"
          git push origin HEAD:feat/payments-refund-by-commercial-reference
