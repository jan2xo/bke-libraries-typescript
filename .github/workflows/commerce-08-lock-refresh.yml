name: Commerce 0.8 Lock Refresh

on:
  push:
    branches: [feat/commerce-public-promotion-pricing]
    paths:
      - "@bke/commerce/package.json"
      - ".github/workflows/commerce-08-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-public-promotion-pricing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh workspace lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- @bke/commerce/package.json
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --name-only | grep -Fx package-lock.json
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "chore(commerce): refresh 0.8.0 workspace lock"
          git push origin HEAD:feat/commerce-public-promotion-pricing
