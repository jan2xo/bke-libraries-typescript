name: BKE Library - Identity Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Pack Identity package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          artifact="$(npm pack --workspace=@bke/identity --pack-destination artifacts --silent | tail -n 1)"
          artifact="$(basename "$artifact")"
          test "$artifact" = "bke-identity-0.5.0.tgz"
          test -s "artifacts/$artifact"
          sha256sum "artifacts/$artifact" | tee "artifacts/$artifact.sha256"
          echo "IDENTITY_ARTIFACT=$artifact" >> "$GITHUB_ENV"
      - name: Certify package contents
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf "artifacts/$IDENTITY_ARTIFACT" > artifacts/package-contents.txt
          for required in \
            package/package.json \
            package/module.manifest.ts \
            package/contracts/identity.contract.ts \
            package/contracts/google-identity.contract.ts \
            package/contracts/google-authentication.contract.ts \
            package/contracts/recent-auth-completion.contract.ts \
            package/contracts/recent-auth-challenge.contract.ts \
            package/logic/recent-auth-challenge-repository.ts \
            package/logic/recent-auth-completion.ts \
            package/logic/recent-auth-challenge-issuance.ts \
            package/prisma/repositories/postgres-recent-auth-completion-repository.ts \
            package/prisma/repositories/postgres-recent-auth-challenge-repository.ts \
            package/docs/GOOGLE-OIDC.md \
            package/logic/google-authentication.ts \
            package/contracts/password-login.contract.ts \
            package/contracts/login-mfa-challenge-reissue.contract.ts \
            package/contracts/password-change-session.contract.ts \
            package/contracts/session-administration.contract.ts \
            package/logic/identity-service.ts \
            package/logic/google-identity.ts \
            package/logic/google-identity-repository.ts \
            package/prisma/repositories/postgres-google-identity-repository.ts \
            package/migrations/0002_google_identity/migration.sql \
            package/logic/password-login.ts \
            package/logic/login-mfa-challenge-reissue.ts \
            package/logic/password-change-session.ts \
            package/logic/session-administration.ts \
            package/providers/argon2-password-verifier.ts \
            package/prisma/schema.prisma \
            package/prisma/repositories/postgres-identity-repository.ts \
            package/prisma/repositories/postgres-session-administration-repository.ts \
            package/migrations/0001_identity_baseline/migration.sql \
            package/docs/EXTRACTION.md; do
            grep -Fx "$required" artifacts/package-contents.txt
          done
          if grep -E '^package/(tests|node_modules)/' artifacts/package-contents.txt; then
            echo '::error::Tests or dependency caches must not ship in @bke/identity.'
            exit 1
          fi
      - name: Install tarball in blank consumer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .package-smoke
          mkdir -p .package-smoke
          cat > .package-smoke/package.json <<JSON
          {
            "private": true,
            "type": "module",
            "dependencies": { "@bke/identity": "file:../artifacts/$IDENTITY_ARTIFACT" },
            "devDependencies": {
              "@types/node": "^24.3.0",
              "@types/pg": "^8.15.5",
              "tsx": "^4.20.5",
              "typescript": "^5.9.2"
            }
          }
          JSON
          cat > .package-smoke/tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "types": ["node"]
            },
            "include": ["smoke.ts"]
          }
          JSON
          cat > .package-smoke/smoke.ts <<'TS'
          import { IDENTITY_LOOKUP_CAPABILITY_ID, type IdentityPrincipal } from "@bke/identity/contracts/identity.contract";
          import { IDENTITY_PASSWORD_LOGIN_CAPABILITY_ID } from "@bke/identity/contracts/password-login.contract";
          import { IDENTITY_GOOGLE_PRINCIPAL_BINDING_CAPABILITY_ID } from "@bke/identity/contracts/google-identity.contract";
          import { IDENTITY_GOOGLE_AUTHENTICATION_CAPABILITY_ID } from "@bke/identity/contracts/google-authentication.contract";
          import type { IdentityRecentAuthCompletionInput } from "@bke/identity/contracts/recent-auth-completion.contract";
          import { IDENTITY_LOGIN_MFA_CHALLENGE_REISSUE_CAPABILITY_ID } from "@bke/identity/contracts/login-mfa-challenge-reissue.contract";
          import { IDENTITY_PASSWORD_CHANGE_SESSION_CAPABILITY_ID } from "@bke/identity/contracts/password-change-session.contract";
          import { IDENTITY_SESSION_ADMINISTRATION_CAPABILITY_ID } from "@bke/identity/contracts/session-administration.contract";
          import { createIdentityLookupCapability } from "@bke/identity/logic/identity-service";
          import { createIdentityGooglePrincipalBindingCapability } from "@bke/identity/logic/google-identity";
          import { createIdentityGoogleAuthenticationCapability } from "@bke/identity/logic/google-authentication";
          import { createIdentityRecentAuthCompletionCapability } from "@bke/identity/logic/recent-auth-completion";
          import { createIdentityPasswordLoginCapability } from "@bke/identity/logic/password-login";
          import { createIdentityLoginMfaChallengeReissueCapability } from "@bke/identity/logic/login-mfa-challenge-reissue";
          import { createIdentityPasswordChangeSessionCapability } from "@bke/identity/logic/password-change-session";
          import { createIdentitySessionAdministrationCapability } from "@bke/identity/logic/session-administration";
          import { createArgon2PasswordVerifier } from "@bke/identity/providers/argon2-password-verifier";
          import { createPostgresIdentityRepository } from "@bke/identity/prisma/repositories/postgres-identity-repository";
          import { createPostgresIdentityGoogleIdentityRepository, createTransactionBoundPostgresGoogleIdentityRepository } from "@bke/identity/prisma/repositories/postgres-google-identity-repository";
          import { createPostgresIdentitySessionAdministrationRepository } from "@bke/identity/prisma/repositories/postgres-session-administration-repository";
          import { createPostgresIdentityRecentAuthCompletionRepository } from "@bke/identity/prisma/repositories/postgres-recent-auth-completion-repository";
          import { createPostgresIdentityRecentAuthChallengeRepository } from "@bke/identity/prisma/repositories/postgres-recent-auth-challenge-repository";
          import { identityModuleManifest } from "@bke/identity/module.manifest";

          const establishment = (principal: IdentityPrincipal): Date => principal.establishedAt;
          if (typeof establishment !== "function") throw new Error("Identity establishment contract is unavailable.");
          if (IDENTITY_LOOKUP_CAPABILITY_ID !== "bke.identity.lookup.v1") throw new Error("Unexpected Identity lookup capability id.");
          for (const id of [
            IDENTITY_PASSWORD_LOGIN_CAPABILITY_ID,
            IDENTITY_GOOGLE_PRINCIPAL_BINDING_CAPABILITY_ID,
            IDENTITY_GOOGLE_AUTHENTICATION_CAPABILITY_ID,
            IDENTITY_LOGIN_MFA_CHALLENGE_REISSUE_CAPABILITY_ID,
            IDENTITY_PASSWORD_CHANGE_SESSION_CAPABILITY_ID,
            IDENTITY_SESSION_ADMINISTRATION_CAPABILITY_ID,
          ]) {
            if (!id.startsWith("bke.identity.")) throw new Error("Unexpected Identity auth parity capability id.");
          }
          if (identityModuleManifest.moduleId !== "identity") throw new Error("Unexpected Identity manifest moduleId.");
          for (const value of [
            createIdentityLookupCapability,
            createIdentityGooglePrincipalBindingCapability,
            createIdentityGoogleAuthenticationCapability,
            createIdentityRecentAuthCompletionCapability,
            createPostgresIdentityGoogleIdentityRepository,
            createTransactionBoundPostgresGoogleIdentityRepository,
            createIdentityPasswordLoginCapability,
            createIdentityLoginMfaChallengeReissueCapability,
            createIdentityPasswordChangeSessionCapability,
            createIdentitySessionAdministrationCapability,
            createArgon2PasswordVerifier,
            createPostgresIdentityRepository,
            createPostgresIdentitySessionAdministrationRepository,
            createPostgresIdentityRecentAuthCompletionRepository,
            createPostgresIdentityRecentAuthChallengeRepository,
          ]) {
            if (typeof value !== "function") throw new Error("Packed Identity consumer exports are incomplete.");
          }
          if (IDENTITY_GOOGLE_PRINCIPAL_BINDING_CAPABILITY_ID !== "bke.identity.google-principal-binding.v1") throw new Error("Unexpected Google binding capability id.");
          if (IDENTITY_GOOGLE_AUTHENTICATION_CAPABILITY_ID !== "bke.identity.google-authentication.v1") throw new Error("Unexpected Google authentication capability id.");
          const recentAuthInput: IdentityRecentAuthCompletionInput | undefined = undefined;
          if (recentAuthInput !== undefined) throw new Error("Unexpected recent-auth smoke value.");
          console.log("Packed @bke/identity 0.5.0 Google identity consumer smoke GREEN");
          TS
          npm install --prefix .package-smoke
          npx --prefix .package-smoke tsc -p .package-smoke/tsconfig.json --noEmit
          npx --prefix .package-smoke tsx .package-smoke/smoke.ts
      - name: Upload certified package evidence
        uses: actions/upload-artifact@v7
        with:
          name: bke-identity-0.5.0
          path: |
            artifacts/bke-identity-0.5.0.tgz
            artifacts/bke-identity-0.5.0.tgz.sha256
            artifacts/package-contents.txt
          if-no-files-found: error
