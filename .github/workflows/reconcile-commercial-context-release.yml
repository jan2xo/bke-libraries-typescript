name: Reconcile commercial context release

on:
  push:
    branches: [feat/licensing-commercial-context-composition]
    paths:
      - ".github/workflows/reconcile-commercial-context-release.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/licensing-commercial-context-composition
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Merge canonical main and reconcile release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e

          if [[ "$merge_status" -ne 0 ]]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Merge conflicts:"
            echo "$conflicts"
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              if [[ "$file" != "package-lock.json" ]]; then
                echo "::error::Unexpected merge conflict outside package-lock.json: $file"
                git merge --abort || true
                exit 1
              fi
              git checkout --theirs -- "$file"
              git add "$file"
            done <<< "$conflicts"
            git commit --no-edit
          fi

          git merge-base --is-ancestor origin/main HEAD

          npm pkg set version=0.6.0 --workspace=@bke/licensing
          npm install --package-lock-only --ignore-scripts

          node <<'NODE'
          const lock = require('./package-lock.json');
          const expected = {
            '@bke/accounts': '0.3.0',
            '@bke/catalog': '0.2.0',
            '@bke/commerce': '0.5.0',
            '@bke/licensing': '0.6.0',
          };
          for (const [name, version] of Object.entries(expected)) {
            const manifest = require(`./${name}/package.json`).version;
            if (manifest !== version) throw new Error(`${name} manifest expected ${version}, got ${manifest}`);
            if (lock.packages?.[name]?.version !== version) throw new Error(`${name} lock expected ${version}, got ${lock.packages?.[name]?.version}`);
          }
          NODE

          git add @bke/licensing/package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: version commercial context release"
          fi

          git push origin HEAD:feat/licensing-commercial-context-composition
