name: Catalog Extraction Bootstrap

on:
  push:
    branches: [feat/catalog-0.1.0]
    paths:
      - ".github/workflows/catalog-extraction-bootstrap.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jan2xo/bke-digital-solutions
          ref: bef144b6dadf63019df743cf384736810bb51a0f
          path: .catalog-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy certified Catalog reusable surface
        shell: bash
        run: |
          set -euo pipefail
          src=.catalog-source/v2/modules/catalog
          dst=@bke/catalog
          rm -rf "$dst"
          mkdir -p "$dst/contracts" "$dst/logic" "$dst/prisma/repositories" "$dst/migrations" "$dst/docs" "$dst/tests"
          cp -a "$src/contracts/." "$dst/contracts/"
          cp -a "$src/logic/." "$dst/logic/"
          cp "$src/prisma/schema.prisma" "$dst/prisma/schema.prisma"
          cp -a "$src/prisma/repositories/." "$dst/prisma/repositories/"
          cp -a "$src/prisma/migrations/." "$dst/migrations/"
          cp -a "$src/docs/." "$dst/docs/"
          cp "$src/module.manifest.ts" "$dst/module.manifest.ts"
          cp "$src/test/catalog.test.ts" "$dst/tests/catalog.test.ts"
          cp "$src/test/postgres.certify.ts" "$dst/tests/postgres.certify.ts"
      - name: Add package shell and library extraction cert
        shell: bash
        run: |
          set -euo pipefail
          cat > @bke/catalog/package.json <<'JSON'
          {
            "name": "@bke/catalog",
            "version": "0.1.0",
            "description": "Reusable BKE Product and Edition catalog identity, lookup, management, and module-owned PostgreSQL persistence capabilities",
            "type": "module",
            "engines": { "node": ">=22.12.0" },
            "files": ["contracts", "logic", "prisma", "migrations", "docs", "module.manifest.ts", "prisma.config.ts", "README.md"],
            "exports": {
              "./contracts/*": "./contracts/*.ts",
              "./logic/*": "./logic/*.ts",
              "./prisma/repositories/*": "./prisma/repositories/*.ts",
              "./module.manifest": "./module.manifest.ts",
              "./prisma.config": "./prisma.config.ts",
              "./package.json": "./package.json"
            },
            "scripts": {
              "typecheck": "tsc -p tsconfig.json --noEmit",
              "test": "vitest run tests/catalog.test.ts",
              "prisma:validate": "prisma validate --config prisma.config.ts",
              "prisma:deploy": "prisma migrate deploy --config prisma.config.ts"
            },
            "dependencies": { "pg": "^8.16.3" }
          }
          JSON
          cat > @bke/catalog/tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "lib": ["ES2022", "DOM"],
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "esModuleInterop": true,
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "types": ["node", "vitest/globals"]
            },
            "include": ["contracts/**/*.ts", "logic/**/*.ts", "prisma/**/*.ts", "tests/**/*.ts", "module.manifest.ts", "prisma.config.ts"]
          }
          JSON
          cat > @bke/catalog/prisma.config.ts <<'TS'
          import { defineConfig, env } from "prisma/config";

          export default defineConfig({
            schema: "prisma/schema.prisma",
            migrations: { path: "migrations" },
            datasource: { url: env("DATABASE_URL") },
          });
          TS
          cat > @bke/catalog/README.md <<'MD'
          # @bke/catalog

          Reusable BKE Catalog capability for Product and Edition identity, lookup, management, and module-owned PostgreSQL persistence.

          Catalog answers **what the product or edition is**. It does not own Commerce pricing/orders, Payments, Entitlements, Licensing, Distribution, or UI.

          Standard v0.1.0 kinds: `SOFTWARE`, `SAAS`, `HYBRID`, `SCRIPT`, `DIGITAL_ASSET`.
          MD
          cat > @bke/catalog/tests/extraction.certify.ts <<'TS'
          import assert from "node:assert/strict";
          import { readdirSync, readFileSync, statSync } from "node:fs";
          import { extname, join } from "node:path";
          import { catalogModuleManifest } from "../module.manifest";

          const root = "@bke/catalog";
          const reusableRoots = [`${root}/contracts`, `${root}/logic`, `${root}/prisma/repositories`];
          const files = [
            ...reusableRoots.flatMap(function filesUnder(path: string): string[] {
              const found: string[] = [];
              for (const name of readdirSync(path)) {
                const child = join(path, name);
                if (statSync(child).isDirectory()) found.push(...filesUnder(child));
                else if ([".ts", ".tsx", ".js", ".mjs"].includes(extname(child))) found.push(child);
              }
              return found;
            }),
            `${root}/module.manifest.ts`,
          ];
          const forbidden = [
            `${"@"}/bke/`, `${"@"}/`, "next/", '"server-only"', "v2/", "generated/prisma",
            "/modules/commerce/", "/modules/payments/", "/modules/entitlements/", "/modules/licensing/", "/modules/distribution/",
          ];
          for (const file of files) {
            const text = readFileSync(file, "utf8");
            for (const marker of forbidden) assert.equal(text.includes(marker), false, `${file} contains forbidden marker: ${marker}`);
          }
          assert.equal(catalogModuleManifest.moduleId, "catalog");
          assert.deepEqual(catalogModuleManifest.needs, []);
          assert.deepEqual(catalogModuleManifest.provides, ["bke.catalog.lookup.v1", "bke.catalog.management.v1"]);
          const schema = readFileSync(`${root}/prisma/schema.prisma`, "utf8");
          const models = [...schema.matchAll(/^model\s+(\w+)\s*\{/gm)].map((match) => match[1]).sort();
          assert.deepEqual(models, ["CatalogEdition", "CatalogProduct"]);
          const migrations = readdirSync(`${root}/migrations`).filter((name) => statSync(join(`${root}/migrations`, name)).isDirectory()).sort();
          assert.deepEqual(migrations, ["0001_catalog_product_edition"]);
          console.log(`@bke/catalog extraction GREEN: files=${files.length} models=${models.join(",")} migrations=${migrations.join(",")}`);
          TS
      - name: Refresh workspace lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit extracted package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .catalog-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add @bke/catalog package-lock.json
          git commit -m "feat(catalog): extract @bke/catalog 0.1.0"
          git push origin HEAD:feat/catalog-0.1.0
