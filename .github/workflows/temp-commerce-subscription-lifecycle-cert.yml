name: Temporary Commerce Subscription Lifecycle Certification

on:
  push:
    branches: [feat/commerce-subscription-lifecycle-management]
    paths:
      - ".github/workflows/temp-commerce-subscription-lifecycle-cert.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bke
          POSTGRES_PASSWORD: bke
          POSTGRES_DB: bke_commerce_library
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bke -d bke_commerce_library"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bke:bke@localhost:5432/bke_commerce_library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Certify Commerce extraction boundary
        run: npx tsx @bke/commerce/tests/extraction.certify.ts
      - name: Typecheck Commerce
        run: npm run typecheck --workspace=@bke/commerce
      - name: Validate Commerce Prisma schema
        run: npm run prisma:validate --workspace=@bke/commerce
      - name: Apply Commerce migrations
        run: npm run prisma:deploy --workspace=@bke/commerce
      - name: Prove migration idempotence
        run: npm run prisma:deploy --workspace=@bke/commerce
      - name: Test Commerce logic
        run: npm run test --workspace=@bke/commerce
      - name: Re-certify parent purchase-plan management
        run: npx tsx @bke/commerce/tests/purchase-plan-management.postgres.certify.ts
      - name: Certify subscription lifecycle with PostgreSQL
        run: npx tsx @bke/commerce/tests/subscription-lifecycle-management.postgres.certify.ts
      - name: Pack Commerce 0.10.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts .package-smoke
          mkdir -p artifacts .package-smoke
          artifact="$(npm pack --workspace=@bke/commerce --pack-destination artifacts --silent | tail -n 1)"
          test "$(basename "$artifact")" = "bke-commerce-0.10.0.tgz"
          tar -tzf "artifacts/bke-commerce-0.10.0.tgz" > artifacts/package-contents.txt
          for required in \
            package/contracts/subscription-lifecycle-management.contract.ts \
            package/logic/subscription-lifecycle-management.ts \
            package/prisma/repositories/postgres-subscription-lifecycle-management-repository.ts; do
            grep -Fx "$required" artifacts/package-contents.txt
          done
      - name: Smoke packed subscription lifecycle exports
        shell: bash
        run: |
          set -euo pipefail
          cat > .package-smoke/package.json <<'JSON'
          {
            "private": true,
            "type": "module",
            "dependencies": { "@bke/commerce": "file:../artifacts/bke-commerce-0.10.0.tgz" },
            "devDependencies": {
              "@types/node": "^24.3.0",
              "@types/pg": "^8.15.5",
              "tsx": "^4.20.5",
              "typescript": "^5.9.2"
            }
          }
          JSON
          cat > .package-smoke/tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "lib": ["ES2022", "DOM"],
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "types": ["node"]
            },
            "include": ["smoke.ts"]
          }
          JSON
          cat > .package-smoke/smoke.ts <<'TS'
          import { COMMERCE_SUBSCRIPTION_LIFECYCLE_MANAGEMENT_CAPABILITY_ID } from "@bke/commerce/contracts/subscription-lifecycle-management.contract";
          import { createCommerceSubscriptionLifecycleManagementCapability } from "@bke/commerce/logic/subscription-lifecycle-management";
          import { createPostgresCommerceSubscriptionLifecycleRepository } from "@bke/commerce/prisma/repositories/postgres-subscription-lifecycle-management-repository";
          import { commerceModuleManifest } from "@bke/commerce/module.manifest";
          if (!commerceModuleManifest.provides.includes(COMMERCE_SUBSCRIPTION_LIFECYCLE_MANAGEMENT_CAPABILITY_ID)) throw new Error("Subscription lifecycle capability is not published.");
          if (typeof createCommerceSubscriptionLifecycleManagementCapability !== "function" || typeof createPostgresCommerceSubscriptionLifecycleRepository !== "function") throw new Error("Subscription lifecycle exports missing.");
          console.log("Packed @bke/commerce 0.10.0 subscription lifecycle smoke GREEN");
          TS
          npm install --prefix .package-smoke
          npx --prefix .package-smoke tsc -p .package-smoke/tsconfig.json --noEmit
          npx --prefix .package-smoke tsx .package-smoke/smoke.ts
      - run: git diff --check
